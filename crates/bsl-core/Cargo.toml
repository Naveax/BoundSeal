[package]
name = "bsl-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false
autobins = false

[[bin]]
name = "bsl"
path = "src/bsl.rs"

[features]
default = []
live-network = [
    "dep:bsl-executor",
    "dep:bsl-gateway",
    "dep:bsl-live-adapter",
    "dep:bsl-passive-analyzers",
    "dep:bsl-pinned-transport",
    "dep:bsl-stream",
    "dep:bsl-transport",
]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
bsl-events = { path = "../bsl-events" }
bsl-executor = { path = "../bsl-executor", optional = true }
bsl-gateway = { path = "../bsl-gateway", optional = true }
bsl-live-adapter = { path = "../bsl-live-adapter", optional = true }
bsl-operator = { path = "../bsl-operator" }
bsl-passive-analyzers = { path = "../bsl-passive-analyzers", optional = true }
bsl-pinned-transport = { path = "../bsl-pinned-transport", optional = true }
bsl-policy = { path = "../bsl-policy" }
bsl-session-injection = { path = "../bsl-session-injection" }
bsl-stream = { path = "../bsl-stream", optional = true }
bsl-transport = { path = "../bsl-transport", optional = true }
bsl-unified-operator = { path = "../bsl-unified-operator" }
bsl-vault-provider = { path = "../bsl-vault-provider" }
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true
