[workspace]
members = [
    "crates/nxb-active-validation",
    "crates/nxb-adapter-boundary",
    "crates/nxb-audit",
    "crates/nxb-budget",
    "crates/nxb-channel-contracts",
    "crates/nxb-content-analysis",
    "crates/nxb-cookie-jar",
    "crates/nxb-core",
    "crates/nxb-destination",
    "crates/nxb-dns",
    "crates/nxb-events",
    "crates/nxb-executor",
    "crates/nxb-gateway",
    "crates/nxb-http1",
    "crates/nxb-http1-fixture",
    "crates/nxb-knowledge-reporting",
    "crates/nxb-lifecycle-governance",
    "crates/nxb-local-executor",
    "crates/nxb-passive-analyzers",
    "crates/nxb-pinned-transport",
    "crates/nxb-planner",
    "crates/nxb-platform-assurance",
    "crates/nxb-post-closure-governance",
    "crates/nxb-policy",
    "crates/nxb-redirect",
    "crates/nxb-release-governance",
    "crates/nxb-replay-lab",
    "crates/nxb-session",
    "crates/nxb-stream",
    "crates/nxb-stream-fixture",
    "crates/nxb-tls",
    "crates/nxb-transport",
    "crates/nxb-vault",
    "crates/nxb-workflow-graph",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Naveax"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
httpdate = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
url = { version = "2.5", features = ["serde"] }
zeroize = "1.8"
