[workspace]
members = [
    "crates/bsl-active-validation",
    "crates/bsl-adapter-boundary",
    "crates/bsl-audit",
    "crates/bsl-budget",
    "crates/bsl-channel-contracts",
    "crates/bsl-content-analysis",
    "crates/bsl-cookie-jar",
    "crates/bsl-core",
    "crates/bsl-destination",
    "crates/bsl-dns",
    "crates/bsl-events",
    "crates/bsl-evidence-key-provider",
    "crates/bsl-evidence-key-provider-process",
    "crates/bsl-evidence-sealer",
    "crates/bsl-executor",
    "crates/bsl-gateway",
    "crates/bsl-http1",
    "crates/bsl-http1-fixture",
    "crates/bsl-knowledge-reporting",
    "crates/bsl-lifecycle-governance",
    "crates/bsl-live-adapter",
    "crates/bsl-live-run-host",
    "crates/bsl-local-executor",
    "crates/bsl-manual-submission-handoff",
    "crates/bsl-operator",
    "crates/bsl-operator-runtime",
    "crates/bsl-resumable-runner",
    "crates/bsl-run-closure",
    "crates/bsl-operator-state",
    "crates/bsl-passive-analyzers",
    "crates/bsl-pinned-transport",
    "crates/bsl-planner",
    "crates/bsl-platform-assurance",
    "crates/bsl-post-closure-governance",
    "crates/bsl-policy",
    "crates/bsl-redirect",
    "crates/bsl-release-governance",
    "crates/bsl-replay-lab",
    "crates/bsl-session",
    "crates/bsl-session-injection",
    "crates/bsl-stream",
    "crates/bsl-stream-fixture",
    "crates/bsl-tls",
    "crates/bsl-transport",
    "crates/bsl-unified-operator",
    "crates/bsl-vault",
    "crates/bsl-vault-provider",
    "crates/bsl-vault-provider-process",
    "crates/bsl-workflow-graph",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Naveax"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
httpdate = "1.0"
rcgen = "0.14.8"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
url = { version = "2.5", features = ["serde"] }
webpki-roots = "1.0.9"
zeroize = "1.8"
