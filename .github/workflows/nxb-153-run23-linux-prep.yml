name: NXB-153 Run 23 Linux Fix Prep

on:
  push:
    branches:
      - nxb-153-run23-fix-prep

permissions:
  contents: write

concurrency:
  group: nxb-153-run23-linux-prep
  cancel-in-progress: false

jobs:
  verify-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nxb-153-run23-fix-prep
          fetch-depth: 1

      - name: Apply exact run 23 Linux patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/nxb-153-run23-linux-prep.py

      - name: Verify Rust formatting and admission coverage contract
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup run 1.97.1 cargo fmt --all
          rustup run 1.97.1 cargo fmt --all -- --check
          rustup run 1.97.1 cargo test -p nxb-core --test target_activation_cli --locked -- --test-threads=1
          rustup run 1.97.1 cargo test -p nxb-core --test nxb153_run23_admission_gate_coverage_source_contract --locked -- --test-threads=1

      - name: Prove docs and all-target workspace tests
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          rustup run 1.97.1 cargo doc --workspace --all-features --no-deps --locked
          rustup run 1.97.1 cargo test --workspace --all-targets --all-features --locked -- --test-threads=1

      - name: Seal verified prep branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/nxb-153-run23-linux-prep.yml
          rm -f scripts/nxb-153-run23-linux-prep.py
          git config user.name Naveax
          git config user.email Omersevik095@gmail.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Harden NXB-153 exact-head admission gate coverage'
            git push origin HEAD:nxb-153-run23-fix-prep
          fi
