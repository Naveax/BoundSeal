name: NXB-6 format once

on:
  pull_request:
    branches:
      - main
    paths:
      - "crates/nxb-stream/**"
      - "crates/nxb-stream-fixture/**"
      - ".github/workflows/nxb6-format-once.yml"

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.event.pull_request.head.ref == 'nxb-6-bounded-byte-stream-fixture'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install stable Rust with rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Format workspace
        run: cargo +stable fmt --all

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/nxb-stream crates/nxb-stream-fixture
          git commit -m "chore: rustfmt NXB-6 stream contracts"
          git push origin HEAD:nxb-6-bounded-byte-stream-fixture
