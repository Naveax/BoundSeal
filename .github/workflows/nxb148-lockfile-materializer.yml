name: Temporary NXB-148 canonicalizer

on:
  push:
    branches:
      - nxb-148-production-evidence-sealer
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/nxb-evidence-sealer/**"
      - ".github/workflows/nxb148-lockfile-materializer.yml"

permissions:
  contents: write

concurrency:
  group: nxb148-lockfile-materializer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nxb-148-production-evidence-sealer
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Apply deterministic source hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/nxb-evidence-sealer/src/lib.rs")
          text = path.read_text(encoding="utf-8")

          def replace_region(start_marker: str, end_marker: str, replacement: str) -> None:
              global text
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"start marker not found: {start_marker!r}")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"end marker not found: {end_marker!r}")
              text = text[:start] + replacement + text[end:]

          replace_region(
              "        let plaintext = canonical_json(record)?;\n",
              "        let envelope_bytes = canonical_json(&envelope)?;\n",
              '''        let mut plaintext = canonical_json(record)?;
        let envelope_result = self
            .sealer
            .seal(SealedEvidenceBinding::from_record(record), &plaintext);
        plaintext.zeroize();
        let envelope = envelope_result?;
''',
          )

          replace_region(
              "        let plaintext = self.sealer.open(envelope)?;\n",
              "\n    }\n\n    fn publish(",
              '''        let mut plaintext = self.sealer.open(envelope)?;
        let result = (|| -> Result<EvidenceRecord, EvidenceSealerError> {
            let record: EvidenceRecord = serde_json::from_slice(&plaintext)
                .map_err(|error| EvidenceSealerError::Serialization(error.to_string()))?;
            let mut canonical_plaintext = canonical_json(&record)?;
            let canonical_matches = plaintext.as_slice() == canonical_plaintext.as_slice();
            canonical_plaintext.zeroize();
            if !canonical_matches {
                return Err(EvidenceSealerError::NonCanonicalPlaintext);
            }
            validate_record(&record)?;
            if SealedEvidenceBinding::from_record(&record) != envelope.binding {
                return Err(EvidenceSealerError::BindingMismatch);
            }
            Ok(record)
        })();
        plaintext.zeroize();
        result''',
          )

          replace_region(
              "    let input_bytes = serde_json::to_vec(&input)\n",
              "\n    Ok(())\n}\n\nfn parse_canonical_envelope",
              '''    let mut input_bytes = serde_json::to_vec(&input)
        .map_err(|error| EvidenceSealerError::Serialization(error.to_string()))?;
    let input_matches = input_bytes.len() == record.serialized_bytes
        && hash_bytes(&input_bytes) == record.content_sha256;
    input_bytes.zeroize();
    if !input_matches
        || record.evidence_id != format!("evidence-{}", &record.content_sha256[..24])
    {
        return Err(EvidenceSealerError::EvidenceContentDigestMismatch);
    }''',
          )

          replace_region(
              "fn parse_sealed_file_name(file_name: &str) -> Result<String, EvidenceSealerError> {\n",
              "\n\nfn validate_identifier",
              '''fn parse_sealed_file_name(file_name: &str) -> Result<String, EvidenceSealerError> {
    let evidence_id = file_name
        .strip_suffix(SEALED_EVIDENCE_SUFFIX)
        .ok_or(EvidenceSealerError::UnexpectedStoreEntry)?;
    validate_identifier(evidence_id, "evidence_id")?;
    let digest = evidence_id
        .strip_prefix("evidence-")
        .ok_or(EvidenceSealerError::UnexpectedStoreEntry)?;
    if digest.len() != 24
        || !digest
            .bytes()
            .all(|byte| byte.is_ascii_digit() || (b'a'..=b'f').contains(&byte))
    {
        return Err(EvidenceSealerError::UnexpectedStoreEntry);
    }
    Ok(evidence_id.into())
}''',
          )

          old_digest_error = '''        if hash_bytes(&ciphertext) != envelope.plaintext_sha256 {
            return Err(EvidenceSealerError::PlaintextDigestMismatch);
        }'''
          new_digest_error = '''        if hash_bytes(&ciphertext) != envelope.plaintext_sha256 {
            ciphertext.zeroize();
            return Err(EvidenceSealerError::PlaintextDigestMismatch);
        }'''
          if text.count(old_digest_error) != 1:
              raise SystemExit("plaintext digest error block was not found exactly once")
          text = text.replace(old_digest_error, new_digest_error, 1)

          test_marker = "    #[test]\n    fn key_debug_output_is_redacted() {"
          if text.count(test_marker) != 1:
              raise SystemExit("key debug test marker was not found exactly once")
          test_block = '''    #[test]
    fn malformed_content_addressed_file_name_is_rejected() {
        assert!(matches!(
            parse_sealed_file_name("evidence-gggggggggggggggggggggggg.nxbseal"),
            Err(EvidenceSealerError::UnexpectedStoreEntry)
        ));
        assert!(matches!(
            parse_sealed_file_name("evidence-0123456789abcdef.nxbseal"),
            Err(EvidenceSealerError::UnexpectedStoreEntry)
        ));
    }

'''
          text = text.replace(test_marker, test_block + test_marker, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          cargo generate-lockfile
          cargo fmt --all
          git diff --check
          if git diff --quiet -- Cargo.lock crates/nxb-evidence-sealer/src/lib.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/nxb-evidence-sealer/src/lib.rs
          git commit -m "NXB-148: zeroize plaintext and tighten file identities"
          git push origin HEAD:nxb-148-production-evidence-sealer
