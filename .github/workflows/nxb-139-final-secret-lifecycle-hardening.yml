name: NXB-139 final secret lifecycle hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    name: Harden secret construction and teardown
    runs-on: ubuntu-slim
    timeout-minutes: 50

    steps:
      - name: Checkout NXB-139 branch
        uses: actions/checkout@v7
        with:
          ref: nxb-139-external-vault-provider-lifecycle
          fetch-depth: 0

      - name: Apply final lifecycle hardening
        run: python3 tools/nxb139_final_secret_lifecycle_hardening.py

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          fi
          source "$HOME/.cargo/env" 2>/dev/null || true
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Verify final lifecycle hardening
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" 2>/dev/null || true
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          git diff --check

      - name: Commit final lifecycle hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/nxb-vault-provider/src/provider.inc.rs \
            crates/nxb-vault-provider/src/lifecycle.inc.rs \
            crates/nxb-vault-provider/src/validation.inc.rs \
            crates/nxb-vault-provider/src/tests.rs
          git commit -m "fix: harden external secret construction and teardown"
          git push origin HEAD:nxb-139-external-vault-provider-lifecycle
