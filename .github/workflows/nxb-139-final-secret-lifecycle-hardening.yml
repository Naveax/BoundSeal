name: NXB-139 final secret lifecycle hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    name: Harden secret construction and teardown
    runs-on: ubuntu-slim
    timeout-minutes: 50

    steps:
      - name: Checkout NXB-139 branch
        uses: actions/checkout@v7
        with:
          ref: nxb-139-external-vault-provider-lifecycle
          fetch-depth: 0

      - name: Apply final lifecycle hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          provider_path = Path('crates/nxb-vault-provider/src/provider.inc.rs')
          provider = provider_path.read_text(encoding='utf-8')
          old = '''    pub fn new(
              version_id: impl Into<String>,
              value: Vec<u8>,
              expires_at_epoch_seconds: i64,
          ) -> Result<Self, VaultProviderError> {
              let version_id = version_id.into();
              validate_identifier(&version_id, "provider_version_id")?;
              if value.is_empty() || value.len() > MAX_SECRET_BYTES {
                  return Err(VaultProviderError::SecretValueSize);
              }
              Ok(Self {
                  version_id,
                  value: Zeroizing::new(value),
                  expires_at_epoch_seconds,
              })
          }
          '''
          old = old.replace('          ', '    ')
          new = '''    pub fn new(
              version_id: impl Into<String>,
              value: Vec<u8>,
              expires_at_epoch_seconds: i64,
          ) -> Result<Self, VaultProviderError> {
              let value = Zeroizing::new(value);
              let version_id = version_id.into();
              validate_identifier(&version_id, "provider_version_id")?;
              if value.is_empty() || value.len() > MAX_SECRET_BYTES {
                  return Err(VaultProviderError::SecretValueSize);
              }
              Ok(Self {
                  version_id,
                  value,
                  expires_at_epoch_seconds,
              })
          }
          '''
          new = new.replace('          ', '    ')
          if provider.count(old) != 1:
              raise SystemExit(f'unexpected ProviderSecretMaterial constructor count: {provider.count(old)}')
          provider_path.write_text(provider.replace(old, new, 1), encoding='utf-8', newline='\n')

          lifecycle_path = Path('crates/nxb-vault-provider/src/lifecycle.inc.rs')
          lifecycle = lifecycle_path.read_text(encoding='utf-8')
          old = '''            let handle = vault.insert(
                  SecretInput {
                      kind: spec.kind,
                      value: std::mem::take(&mut *material.value),
                      binding,
                      delivery: spec.delivery.secret_delivery()?,
                      expires_at_epoch_seconds: Some(material.expires_at_epoch_seconds),
                  },
                  now_epoch_seconds,
              )?;
          '''
          old = old.replace('          ', '    ')
          new = '''            let delivery = spec.delivery.secret_delivery()?;
              let value = std::mem::take(&mut *material.value);
              let handle = vault.insert(
                  SecretInput {
                      kind: spec.kind,
                      value,
                      binding,
                      delivery,
                      expires_at_epoch_seconds: Some(material.expires_at_epoch_seconds),
                  },
                  now_epoch_seconds,
              )?;
          '''
          new = new.replace('          ', '    ')
          if lifecycle.count(old) != 1:
              raise SystemExit(f'unexpected vault insert block count: {lifecycle.count(old)}')
          lifecycle = lifecycle.replace(old, new, 1)

          old = '''    provisioned.receipt.verify()?;
              broker.revoke_session(&provisioned.session.session_id)?;
              let mut revoke_error = None;
              for handle in &provisioned.handles {
                  if let Err(error) = vault.revoke_secret(handle) {
                      revoke_error.get_or_insert(error);
                  }
              }
              if let Some(error) = revoke_error {
                  return Err(error.into());
              }
          '''
          old = old.replace('          ', '    ')
          new = '''    provisioned.receipt.verify()?;
              if let Err(error) = rollback_provisioning(
                  Some(&provisioned.session),
                  &provisioned.handles,
                  broker,
                  vault,
              ) {
                  return Err(VaultProviderError::TeardownFailed(error));
              }
          '''
          new = new.replace('          ', '    ')
          if lifecycle.count(old) != 1:
              raise SystemExit(f'unexpected teardown block count: {lifecycle.count(old)}')
          lifecycle_path.write_text(lifecycle.replace(old, new, 1), encoding='utf-8', newline='\n')

          validation_path = Path('crates/nxb-vault-provider/src/validation.inc.rs')
          validation = validation_path.read_text(encoding='utf-8')
          marker = '''    #[error("external-vault teardown receipt is invalid")]
              InvalidTeardownReceipt,
          '''.replace('          ', '    ')
          replacement = '''    #[error("external-vault teardown failed after attempting all revocations: {0}")]
              TeardownFailed(String),
              #[error("external-vault teardown receipt is invalid")]
              InvalidTeardownReceipt,
          '''.replace('          ', '    ')
          if validation.count(marker) != 1:
              raise SystemExit(f'unexpected teardown error marker count: {validation.count(marker)}')
          validation_path.write_text(validation.replace(marker, replacement, 1), encoding='utf-8', newline='\n')

          tests_path = Path('crates/nxb-vault-provider/src/tests.rs')
          tests = tests_path.read_text(encoding='utf-8')
          marker = '''    #[test]
              fn duplicate_or_broad_specs_fail_before_provider_use() {
          '''.replace('          ', '    ')
          test = '''    #[test]
              fn teardown_still_revokes_vault_values_when_broker_is_wrong() {
                  let key_pair = Ed25519KeyPair::from_seed_unchecked(&[19_u8; 32]).unwrap();
                  let plan = plan(key_pair.public_key().as_ref());
                  let certificate = certificate(&plan, &key_pair);
                  let consumed = consumed(&plan, &certificate, &key_pair, "wrong-broker-teardown");
                  let mut provider = provider();
                  let mut vault = InMemorySecretVault::new("wrong-broker-vault").unwrap();
                  let mut original_broker = SessionBroker::new("original-broker").unwrap();
                  let provisioned = bootstrap_external_session(
                      &plan,
                      consumed,
                      &mut provider,
                      &mut original_broker,
                      &mut vault,
                      NOW + 1,
                  )
                  .unwrap();
                  assert_eq!(vault.secret_count(), 2);

                  let mut wrong_broker = SessionBroker::new("wrong-broker").unwrap();
                  assert!(matches!(
                      deprovision_external_session(
                          provisioned,
                          &mut wrong_broker,
                          &mut vault,
                          NOW + 2,
                      ),
                      Err(VaultProviderError::TeardownFailed(_))
                  ));
                  assert_eq!(vault.secret_count(), 0);
              }

              #[test]
              fn duplicate_or_broad_specs_fail_before_provider_use() {
          '''.replace('          ', '    ')
          if tests.count(marker) != 1:
              raise SystemExit(f'unexpected final test marker count: {tests.count(marker)}')
          tests_path.write_text(tests.replace(marker, test, 1), encoding='utf-8', newline='\n')
          PY

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          fi
          source "$HOME/.cargo/env" 2>/dev/null || true
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Verify final lifecycle hardening
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" 2>/dev/null || true
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          git diff --check

      - name: Commit final lifecycle hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/nxb-vault-provider/src/provider.inc.rs \
            crates/nxb-vault-provider/src/lifecycle.inc.rs \
            crates/nxb-vault-provider/src/validation.inc.rs \
            crates/nxb-vault-provider/src/tests.rs
          git commit -m "fix: harden external secret construction and teardown"
          git push origin HEAD:nxb-139-external-vault-provider-lifecycle
