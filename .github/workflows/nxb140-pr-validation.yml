name: NXB-140 temporary PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: nxb140-pr-validation
  cancel-in-progress: false

jobs:
  validate-and-canonicalize:
    if: github.head_ref == 'nxb-140-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact NXB-140 source branch
        uses: actions/checkout@v4
        with:
          ref: nxb-140-unified-live-operator
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Canonicalize lockfile and Rust
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Verify unified operator crate
        run: |
          cargo check -p nxb-unified-operator --all-features --locked
          cargo clippy -p nxb-unified-operator --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-unified-operator --all-features --locked
      - name: Commit canonical files to source branch
        run: |
          if git diff --quiet -- Cargo.lock crates/nxb-unified-operator/src/lib.rs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/nxb-unified-operator/src/lib.rs
          git commit -m 'NXB-140: canonicalize unified operator contract'
          git push origin HEAD:nxb-140-unified-live-operator
