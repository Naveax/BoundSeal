name: NXB-141 contract hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    name: Harden and validate NXB-141 contract
    runs-on: ubuntu-slim
    timeout-minutes: 50

    steps:
      - name: Checkout NXB-141 branch
        uses: actions/checkout@v7
        with:
          ref: nxb-140-unified-live-operator
          fetch-depth: 0

      - name: Apply artifact publication hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          library_path = Path("crates/nxb-unified-operator/src/lib.rs")
          library = library_path.read_text(encoding="utf-8")
          if not library.startswith("#![forbid(unsafe_code)]"):
              library = "#![forbid(unsafe_code)]\n\n" + library
          library_path.write_text(library, encoding="utf-8", newline="\n")

          cli_path = Path("crates/nxb-core/src/bin/nxb-unified-operator.rs")
          cli = cli_path.read_text(encoding="utf-8")
          if not cli.startswith("#![forbid(unsafe_code)]"):
              cli = "#![forbid(unsafe_code)]\n\n" + cli

          old = '''use std::{
              collections::BTreeSet,
              fs,
              path::{Path, PathBuf},
          };
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines()) + "\n"
          new = '''use std::{
              collections::BTreeSet,
              fs::{self, OpenOptions},
              io::Write,
              path::{Path, PathBuf},
          };
          '''
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"
          if cli.count(old) != 1:
              raise SystemExit(f"unexpected CLI import block count: {cli.count(old)}")
          cli = cli.replace(old, new, 1)
          cli = cli.replace(
              'about = "Networkless NXB-140 unified operator artifact binder"',
              'about = "Networkless NXB-141 unified operator artifact binder"',
              1,
          )

          old = '''fn write_json<T: Serialize>(path: &Path, value: &T) -> Result<()> {
              if let Some(parent) = path.parent() {
                  fs::create_dir_all(parent)
                      .with_context(|| format!("could not create {}", parent.display()))?;
              }
              let bytes = serde_json::to_vec_pretty(value).context("could not serialize JSON output")?;
              fs::write(path, [bytes.as_slice(), b"\\n"].concat())
                  .with_context(|| format!("could not write {}", path.display()))
          }
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines()) + "\n"
          new = '''fn write_json<T: Serialize>(path: &Path, value: &T) -> Result<()> {
              let parent = path.parent().unwrap_or_else(|| Path::new("."));
              fs::create_dir_all(parent)
                  .with_context(|| format!("could not create {}", parent.display()))?;
              let file_name = path
                  .file_name()
                  .and_then(|value| value.to_str())
                  .context("output path must end in a UTF-8 file name")?;
              if path.exists() {
                  bail!("refusing to overwrite existing output {}", path.display());
              }
              let bytes = serde_json::to_vec_pretty(value).context("could not serialize JSON output")?;
              let temporary_path = parent.join(format!(
                  ".{file_name}.{}.nxb.tmp",
                  std::process::id()
              ));
              let publication = (|| -> Result<()> {
                  let mut file = OpenOptions::new()
                      .write(true)
                      .create_new(true)
                      .open(&temporary_path)
                      .with_context(|| {
                          format!("could not create {}", temporary_path.display())
                      })?;
                  file.write_all(&bytes)
                      .and_then(|()| file.write_all(b"\\n"))
                      .and_then(|()| file.sync_all())
                      .with_context(|| {
                          format!("could not synchronize {}", temporary_path.display())
                      })?;
                  fs::hard_link(&temporary_path, path).with_context(|| {
                      format!("could not atomically publish {}", path.display())
                  })?;
                  Ok(())
              })();
              if let Err(error) = publication {
                  let _ = fs::remove_file(&temporary_path);
                  return Err(error);
              }
              let _ = fs::remove_file(&temporary_path);
              Ok(())
          }
          '''
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"
          if cli.count(old) != 1:
              raise SystemExit(f"unexpected write_json block count: {cli.count(old)}")
          cli = cli.replace(old, new, 1)

          old = '''#[cfg(test)]
          mod tests {
              use super::path_matches_prefix;

              #[test]
              fn authenticated_prefix_must_not_widen_discovery_scope() {
                  assert!(path_matches_prefix("/app/admin", "/app"));
                  assert!(path_matches_prefix("/app", "/app"));
                  assert!(!path_matches_prefix("/application", "/app"));
                  assert!(!path_matches_prefix("/", "/app"));
              }
          }
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines()) + "\n"
          new = '''#[cfg(test)]
          mod tests {
              use std::{fs, sync::atomic::{AtomicU64, Ordering}};

              use serde_json::json;

              use super::{path_matches_prefix, write_json};

              #[test]
              fn authenticated_prefix_must_not_widen_discovery_scope() {
                  assert!(path_matches_prefix("/app/admin", "/app"));
                  assert!(path_matches_prefix("/app", "/app"));
                  assert!(!path_matches_prefix("/application", "/app"));
                  assert!(!path_matches_prefix("/", "/app"));
              }

              #[test]
              fn artifact_publication_is_complete_and_no_clobber() {
                  static NEXT: AtomicU64 = AtomicU64::new(1);
                  let directory = std::env::temp_dir().join(format!(
                      "nxb141-unified-output-{}-{}",
                      std::process::id(),
                      NEXT.fetch_add(1, Ordering::Relaxed)
                  ));
                  fs::create_dir_all(&directory).unwrap();
                  let output = directory.join("plan.json");
                  write_json(&output, &json!({"version": 1, "state": "ready"})).unwrap();
                  let bytes = fs::read(&output).unwrap();
                  assert!(bytes.ends_with(b"\\n"));
                  let parsed: serde_json::Value = serde_json::from_slice(&bytes).unwrap();
                  assert_eq!(parsed["state"], "ready");
                  assert!(write_json(&output, &json!({"state": "replaced"})).is_err());
                  let unchanged: serde_json::Value =
                      serde_json::from_slice(&fs::read(&output).unwrap()).unwrap();
                  assert_eq!(unchanged["state"], "ready");
                  fs::remove_dir_all(directory).unwrap();
              }
          }
          '''
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"
          if cli.count(old) != 1:
              raise SystemExit(f"unexpected CLI test module count: {cli.count(old)}")
          cli_path.write_text(cli.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          fi
          source "$HOME/.cargo/env" 2>/dev/null || true
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Canonicalize and validate contract branch
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" 2>/dev/null || true
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-unified-operator --all-features --locked
          cargo test -p nxb-core --bin nxb-unified-operator --all-features --locked -- --test-threads=1
          git diff --check

      - name: Commit hardened canonical sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock \
            crates/nxb-unified-operator/src/lib.rs \
            crates/nxb-core/src/bin/nxb-unified-operator.rs
          git commit -m "fix: publish unified operator artifacts atomically"
          git push origin HEAD:nxb-140-unified-live-operator
