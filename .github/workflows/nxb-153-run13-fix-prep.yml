name: NXB-153 Run 13 Fix Prep

on:
  push:
    branches:
      - nxb-153-run13-fix-prep

permissions:
  contents: write

concurrency:
  group: nxb-153-run13-fix-prep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-authority-self-test:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout exact helper head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD
      - name: Patch Windows stat authority and execute self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/nxb-153-rust-toolchain-authority.py'
          $text = [IO.File]::ReadAllText($path)
          $old = @'
            try:
                entry = item.stat(follow_symlinks=False)
            except OSError as error:
                raise AuthorityError(
                    f"could not inspect toolchain entry {relative}: {error}"
                ) from error
            if item.is_symlink() or is_reparse(entry):
                raise AuthorityError(
                    f"toolchain indirection is not admitted: {relative}"
                )
            child = current / item.name
'@
          $new = @'
            child = current / item.name
            try:
                entry = os.stat(child, follow_symlinks=False)
            except OSError as error:
                raise AuthorityError(
                    f"could not inspect toolchain entry {relative}: {error}"
                ) from error
            if item.is_symlink() or is_reparse(entry):
                raise AuthorityError(
                    f"toolchain indirection is not admitted: {relative}"
                )
'@
          if (-not $text.Contains($old)) { throw 'Windows stat authority patch anchor missing' }
          [IO.File]::WriteAllText($path, $text.Replace($old, $new), [Text.UTF8Encoding]::new($false))
          python3 -I $path self-test

  linux-patch-format-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact helper head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Apply authority and Linux fail-closed migration fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          authority = Path('scripts/nxb-153-rust-toolchain-authority.py')
          text = authority.read_text(encoding='utf-8')
          old = '''            try:\n                entry = item.stat(follow_symlinks=False)\n            except OSError as error:\n                raise AuthorityError(\n                    f"could not inspect toolchain entry {relative}: {error}"\n                ) from error\n            if item.is_symlink() or is_reparse(entry):\n                raise AuthorityError(\n                    f"toolchain indirection is not admitted: {relative}"\n                )\n            child = current / item.name\n'''
          new = '''            child = current / item.name\n            try:\n                entry = os.stat(child, follow_symlinks=False)\n            except OSError as error:\n                raise AuthorityError(\n                    f"could not inspect toolchain entry {relative}: {error}"\n                ) from error\n            if item.is_symlink() or is_reparse(entry):\n                raise AuthorityError(\n                    f"toolchain indirection is not admitted: {relative}"\n                )\n'''
          if old not in text:
              raise SystemExit('Windows stat authority patch anchor missing')
          authority.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          regression = Path('crates/nxb-core/tests/nxb153_admission_runtime_regression_source_contract.rs')
          text = regression.read_text(encoding='utf-8')
          insert = r'''

