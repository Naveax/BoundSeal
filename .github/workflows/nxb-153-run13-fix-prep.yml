name: NXB-153 Windows Cleanup Closure Prep

on:
  push:
    branches:
      - nxb-153-run13-fix-prep

permissions:
  contents: write

concurrency:
  group: nxb-153-run13-fix-prep
  cancel-in-progress: false

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact helper head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Parse cleanup patch helpers without residue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'scripts/nxb-153-run13-windows-cleanup-runtime-fix.py',
              'scripts/nxb-153-run13-windows-cleanup-admission-fix.py',
              'scripts/nxb-153-run13-windows-cleanup-selftest-fix.py',
          ]:
              source = Path(name).read_text(encoding='utf-8')
              compile(source, name, 'exec')
          PY

      - name: Apply Windows cleanup runtime closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/nxb-153-run13-windows-cleanup-runtime-fix.py
          python3 -I scripts/nxb-153-run13-windows-cleanup-selftest-fix.py
          python3 -I scripts/nxb-153-run13-windows-cleanup-admission-fix.py

      - name: Parse and exercise production cleanup arbitration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/validate-nxb-153-windows-inner.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            throw "validator parse failed: $($errors | ForEach-Object Message | Out-String)"
          }
          & ./scripts/validate-nxb-153-windows-inner.ps1 -RepoRoot . -SelfTest cleanup-faults

      - name: Verify Rust and closure contracts
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          cargo +1.97.1 fmt --all
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 check --workspace --all-targets --all-features --locked
          cargo +1.97.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo +1.97.1 test -p nxb-core --locked \
            --test windows_validator_cleanup_source_contract \
            --test nxb153_admission_runtime_regression_source_contract \
            --test workspace_replacement_authority_source_contract \
            --test workspace_destructive_cleanup_source_contract \
            --test workspace_facade_lint_source_contract
          cargo +1.97.1 test -p nxb-core --locked target::activation::tests:: -- --test-threads=1
          cargo +1.97.1 test -p nxb-core --locked target::tests:: -- --test-threads=1
          cargo +1.97.1 test -p nxb-core --locked migration::tests -- --test-threads=1
          grep -F 'Prove Windows validator cleanup fault arbitration' .github/workflows/nxb-153-admission.yml >/dev/null
          git diff --check

      - name: Publish verified cleanup closure candidate only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          rm -f \
            .github/workflows/nxb-153-run13-fix-prep.yml \
            scripts/nxb-153-run13-windows-cleanup-runtime-fix.py \
            scripts/nxb-153-run13-windows-cleanup-admission-fix.py \
            scripts/nxb-153-run13-windows-cleanup-selftest-fix.py
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare NXB-153 cleanup runtime closure candidate"
          git push origin "HEAD:refs/heads/nxb-153-run13-fix-prep"
