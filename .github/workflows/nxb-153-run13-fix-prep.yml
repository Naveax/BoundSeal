name: NXB-153 Run 13 Fix Prep

on:
  push:
    branches:
      - nxb-153-run13-fix-prep

permissions:
  contents: write

concurrency:
  group: nxb-153-run13-fix-prep
  cancel-in-progress: false

jobs:
  patch-format-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact helper head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Apply patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/nxb-153-run13-fix-prep.py
          python3 -I scripts/nxb-153-rust-toolchain-authority.py self-test
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          cargo +1.97.1 fmt --all
          cargo +1.97.1 test -p nxb-core --test nxb153_admission_runtime_regression_source_contract --test workspace_replacement_authority_source_contract --test workspace_destructive_cleanup_source_contract
          cargo +1.97.1 test -p nxb-core migration::tests -- --test-threads=1
          git diff --check
      - name: Commit verified helper tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/nxb-153-run13-fix-prep.yml scripts/nxb-153-run13-fix-prep.py
          git config user.name "nxb-153-helper"
          git config user.email "nxb-153-helper@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare NXB-153 run 13 authority fixes"
          git push origin HEAD:nxb-153-run13-fix-prep
