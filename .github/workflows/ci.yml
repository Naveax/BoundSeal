name: CI

on:
  push:
    branches:
      - main
      - "nxb-**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nxb137-normalize:
    name: NXB-137 one-time source normalization
    if: github.event_name == 'push' && github.ref_name == 'nxb-137-signed-bounded-discovery-session'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: nxb-137-signed-bounded-discovery-session

      - name: Normalize signed-session boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          orchestrator = Path("crates/nxb-core/src/live_orchestrator.rs")
          text = orchestrator.read_text()
          old = '''#[cfg(feature = "live-network")]
          #[path = "discovery_session_live.rs"]
          mod discovery_session_live;'''
          new = '''#[cfg(feature = "live-network")]
          #[path = "discovery_session_live.rs"]
          #[allow(dead_code)]
          mod discovery_session_live;'''
          if old not in text:
              raise SystemExit("discovery_session_live module block did not match")
          orchestrator.write_text(text.replace(old, new, 1))

          binary = Path("crates/nxb-core/src/bin/nxb-discovery-session.rs")
          text = binary.read_text()
          text = text.replace(
              '''use std::{
              collections::{BTreeMap, BTreeSet},
              fs,
              net::IpAddr,
              path::{Path, PathBuf},
          };

          #[cfg(feature = "live-network")]
          use std::{thread, time::Duration};''',
              '''use std::{collections::BTreeSet, fs, net::IpAddr, path::PathBuf};

          #[cfg(feature = "live-network")]
          use std::{collections::BTreeMap, path::Path, thread, time::Duration};''',
              1,
          )
          text = text.replace(
              '''use discovery_session::{
              hash_bytes, hash_serializable, lower_hex, method_from_code,
              validate_request_interval_against_policy, DiscoverySessionActivationCertificate,
              DiscoverySessionActivationPayload, DiscoverySessionPlan,
          };''',
              '''use discovery_session::{
              hash_bytes, lower_hex, validate_request_interval_against_policy,
              DiscoverySessionActivationCertificate, DiscoverySessionActivationPayload,
              DiscoverySessionPlan,
          };
          #[cfg(feature = "live-network")]
          use discovery_session::{hash_serializable, method_from_code};''',
              1,
          )
          old = '''            let batch = discover_response(
                      &config,
                      policy,
                      &target,
                      candidate.depth,
                      observation.response_content_type.as_deref(),
                      &observation.response_body,
                  )?;
                  discovered_candidates = discovered_candidates.saturating_add(batch.candidates.len() as u64);
                  scheduler.enqueue_batch(batch);'''
          new = '''            let mut batch = discover_response(
                      &config,
                      policy,
                      &target,
                      candidate.depth,
                      observation.response_content_type.as_deref(),
                      &observation.response_body,
                  )?;
                  batch.candidates.retain(|candidate| {
                      let Ok(url) = Url::parse(&candidate.canonical_url) else {
                          return false;
                      };
                      let Ok(method) = method_from_code(&candidate.method) else {
                          return false;
                      };
                      plan.authorize_candidate(&url, method, candidate.depth).is_ok()
                          && policy.allows_request(&url, method.code())
                  });
                  discovered_candidates = discovered_candidates
                      .saturating_add(batch.candidates.len() as u64);
                  scheduler.enqueue_batch(batch);'''
          if old not in text:
              raise SystemExit("discovery candidate enqueue block did not match")
          binary.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all

      - name: Commit normalized sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/nxb-core/src/live_orchestrator.rs crates/nxb-core/src/discovery_session.rs crates/nxb-core/src/discovery_session_live.rs crates/nxb-core/src/bin/nxb-discovery-session.rs
          git commit -m "NXB-137: normalize bounded session implementation"
          git push origin HEAD:nxb-137-signed-bounded-discovery-session

  rust:
    name: Rust contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust
        run: rustup show active-toolchain

      - name: Lockfile
        run: cargo check --workspace --all-features --locked

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features --locked

      - name: Synthetic system demo
        run: |
          cargo run -p nxb-core --bin nxb --locked -- demo-run --output target/nxb-demo-receipt.json
          cargo run -p nxb-core --bin nxb --locked -- verify-demo target/nxb-demo-receipt.json

  supply-chain:
    name: Dependency policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust
        run: rustup show active-toolchain

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: RustSec audit
        run: cargo audit --deny warnings

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.7

      - name: Dependency policy
        run: cargo deny check