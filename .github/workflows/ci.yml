name: CI

on:
  push:
    branches:
      - main
      - "nxb-**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden-lifecycle-governance:
    name: Harden P13-P15 lifecycle governance
    if: (github.event_name == 'push' && github.ref_name == 'nxb-84-post-freeze-maintenance-contracts') || (github.event_name == 'pull_request' && github.head_ref == 'nxb-84-post-freeze-maintenance-contracts')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Apply fail-closed hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path('crates/nxb-lifecycle-governance/src')
          def x(f,a,b):
              p=r/f;s=p.read_text()
              if a not in s: raise SystemExit(f'missing marker {f}')
              p.write_text(s.replace(a,b,1))
          x('p13_part4.rs','            || self.approver_organization_roots.len() < 2\n        {','            || self.approver_organization_roots.len() < 2\n            || self.approver_organization_roots.len() > 16\n        {')
          x('p13_part7.rs','            || plan.window_sha256 != window.window_sha256\n            || open_incident_count != 0','            || plan.window_sha256 != window.window_sha256\n            || assessment\n                .affected_components\n                .iter()\n                .any(|component| !proposal.component_roots.contains_key(component))\n            || (proposal.class == ChangeClass::SecurityPatch && !assessment.safety_critical)\n            || open_incident_count != 0')
          x('p14_part2.rs','        if expected_ids != self.object_ids\n            || expected_bytes != self.total_bytes','        if expected_ids.len() != self.objects.len()\n            || expected_ids != self.object_ids\n            || expected_bytes != self.total_bytes')
          x('p14_part6.rs','        if !self.exact {','        if !self.exact || self.final_virtual_tick > MAX_RECOVERY_TICKS {')
          x('p14_part6.rs','    pub receipt_sha256: BTreeSet<String>,\n    pub quorum: usize,','    pub receipt_sha256: BTreeSet<String>,\n    pub maximum_final_virtual_tick: u64,\n    pub quorum: usize,')
          x('p14_part7.rs','''        let receipt_sha256 = receipts
            .iter()
            .map(|receipt| receipt.receipt_sha256.clone())
            .collect::<BTreeSet<_>>();''','''        let receipt_sha256 = receipts
            .iter()
            .map(|receipt| receipt.receipt_sha256.clone())
            .collect::<BTreeSet<_>>();
        let maximum_final_virtual_tick = receipts
            .iter()
            .map(|receipt| receipt.final_virtual_tick)
            .max()
            .unwrap_or(0);''')
          x('p14_part7.rs','            &receipt_sha256,\n            required_quorum,','            &receipt_sha256,\n            maximum_final_virtual_tick,\n            required_quorum,')
          x('p14_part7.rs','            receipt_sha256,\n            quorum: required_quorum,','            receipt_sha256,\n            maximum_final_virtual_tick,\n            quorum: required_quorum,')
          x('p14_part7.rs','''        if self.quorum < 2
            || self.engine_ids.len() < self.quorum
            || self.organization_roots.len() < self.quorum
            || self.implementation_roots.len() < self.quorum
            || self.receipt_sha256.len() < self.quorum
        {''','''        let receipt_count = self.receipt_sha256.len();
        if self.quorum < 2
            || receipt_count < self.quorum
            || receipt_count > 16
            || self.engine_ids.len() != receipt_count
            || self.organization_roots.len() != receipt_count
            || self.implementation_roots.len() != receipt_count
            || self.maximum_final_virtual_tick > MAX_RECOVERY_TICKS
            || self.engine_ids.iter().any(|v| validate_identifier(v, "recovery engine").is_err())
            || self.organization_roots.iter().chain(self.implementation_roots.iter()).chain(self.receipt_sha256.iter()).any(|v| validate_sha256(v, "recovery quorum root").is_err())
        {''')
          x('p14_part7.rs','            &self.receipt_sha256,\n            self.quorum,','            &self.receipt_sha256,\n            self.maximum_final_virtual_tick,\n            self.quorum,')
          x('p14_part9.rs','            || redaction.archive_bundle_sha256 != archive.bundle_sha256\n            || recovery.archive_bundle_sha256 != archive.bundle_sha256','            || redaction.archive_bundle_sha256 != archive.bundle_sha256\n            || redaction.object_dispositions.keys().cloned().collect::<BTreeSet<_>>() != archive.object_ids\n            || recovery.archive_bundle_sha256 != archive.bundle_sha256')
          x('p14_part9.rs','            || quorum.archive_bundle_sha256 != archive.bundle_sha256\n        {','            || quorum.archive_bundle_sha256 != archive.bundle_sha256\n            || quorum.maximum_final_virtual_tick > recovery.maximum_virtual_ticks\n        {')
          x('p15_part4.rs','''        if self.quorum < 3
            || self.verifier_manifest_sha256.len() < self.quorum
            || self.organization_roots.len() < self.quorum
            || self.implementation_roots.len() < self.quorum
            || self.receipt_sha256.len() < self.quorum
        {''','''        let receipt_count = self.receipt_sha256.len();
        if self.quorum < 3
            || receipt_count < self.quorum
            || receipt_count > MAX_VERIFIERS
            || self.verifier_manifest_sha256.len() != receipt_count
            || self.organization_roots.len() != receipt_count
            || self.implementation_roots.len() != receipt_count
            || self.verifier_manifest_sha256.iter().chain(self.organization_roots.iter()).chain(self.implementation_roots.iter()).chain(self.receipt_sha256.iter()).any(|v| validate_sha256(v, "independent verifier quorum root").is_err())
        {''')
          PY
          find crates/nxb-lifecycle-governance/src -name '*.rs' -print0 | xargs -0 rustfmt --edition 2021
          cargo fmt --all
      - name: Restore trusted CI
        run: git fetch origin main --depth=1 && git checkout origin/main -- .github/workflows/ci.yml
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "NXB P13-P15: harden lifecycle verification bounds"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  rust:
    name: Rust contract checks
    if: github.head_ref != 'nxb-84-post-freeze-maintenance-contracts' && github.ref_name != 'nxb-84-post-freeze-maintenance-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
