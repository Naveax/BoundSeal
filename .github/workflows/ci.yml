name: CI

on:
  push:
    branches:
      - main
      - "nxb-**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-lifecycle-governance:
    name: Materialize P13-P15 lifecycle governance
    if: (github.event_name == 'push' && github.ref_name == 'nxb-84-post-freeze-maintenance-contracts') || (github.event_name == 'pull_request' && github.head_ref == 'nxb-84-post-freeze-maintenance-contracts')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Verify and materialize payload
        run: |
          test "$(git hash-object .lifecycle/p13-p15.tar.gz)" = "0387078a7c41c53e3eaaba635b68b583befe1d17"
          gzip -t .lifecycle/p13-p15.tar.gz
          if tar -tzf .lifecycle/p13-p15.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "unsafe archive path"
            exit 1
          fi
          tar -xzf .lifecycle/p13-p15.tar.gz -C .
          find crates/nxb-lifecycle-governance/src -name '*.rs' -print0 | xargs -0 rustfmt --edition 2021
          cargo fmt --all

      - name: Remove bootstrap material
        run: |
          rm -rf .lifecycle
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml

      - name: Commit permanent architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "NXB P13-P15: materialize lifecycle governance"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  rust:
    name: Rust contract checks
    if: github.head_ref != 'nxb-84-post-freeze-maintenance-contracts' && github.ref_name != 'nxb-84-post-freeze-maintenance-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features
