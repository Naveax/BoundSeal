name: CI

on:
  push:
    branches:
      - main
      - "nxb-**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0p3-bootstrap:
    name: Materialize P0-P3 batch
    if: github.event_name == 'push' && github.ref_name == 'nxb-p0-p3-networkless-analysis-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          ref: nxb-p0-p3-networkless-analysis-batch
          fetch-depth: 0

      - name: Verify and materialize contracts
        shell: bash
        run: |
          set -euo pipefail
          cat .p0p3/chunk-* > /tmp/p0p3.b64
          echo '1efcd47e76afff4d4ea7a5986597f80db8c9b398461bfaf0961367b07b341e64  /tmp/p0p3.b64' | sha256sum -c -
          base64 --decode /tmp/p0p3.b64 > /tmp/p0p3.tar.gz
          echo '3a6bfb565331bb67fd99c7c3504cb0eeb991c8f8a318d142d033d70d5d233071  /tmp/p0p3.tar.gz' | sha256sum -c -
          rm -rf /tmp/p0p3-src
          mkdir -p /tmp/p0p3-src
          tar -xzf /tmp/p0p3.tar.gz -C /tmp/p0p3-src
          rm -rf crates/nxb-channel-contracts
          cp -R /tmp/p0p3-src/nxb-channel-contracts crates/
          cp -R /tmp/p0p3-src/nxb-content-analysis crates/
          cp -R /tmp/p0p3-src/nxb-planner crates/
          cp -R /tmp/p0p3-src/nxb-passive-analyzers crates/
          cp /tmp/p0p3-src/NXB-P0-P3-NETWORKLESS-ANALYSIS-BATCH.md docs/NXB-P0-P3-NETWORKLESS-ANALYSIS-BATCH.md
          python - <<'PY'
          from pathlib import Path

          workspace = Path('Cargo.toml')
          text = workspace.read_text()
          members = [
              '    "crates/nxb-channel-contracts",\n',
              '    "crates/nxb-content-analysis",\n',
              '    "crates/nxb-passive-analyzers",\n',
              '    "crates/nxb-planner",\n',
          ]
          marker = '    "crates/nxb-cookie-jar",\n'
          missing = [member for member in members if member not in text]
          if missing:
              text = text.replace(marker, ''.join(missing) + marker, 1)
              workspace.write_text(text)

          model = Path('crates/nxb-tls/src/model.rs')
          text = model.read_text()
          marker = '''    pub fn ticket_id(&self) -> &str {
              &self.ticket_id
          }

'''
          getters = '''    pub fn execution_id(&self) -> &str {
              &self.execution_id
          }

          pub fn binding_hash(&self) -> &str {
              &self.binding_hash
          }

          pub fn stream_audit_anchor(&self) -> &str {
              &self.stream_audit_anchor
          }

          pub fn http_host(&self) -> &str {
              &self.http_host
          }

          pub fn port(&self) -> u16 {
              self.port
          }

          pub fn redirect_depth(&self) -> u8 {
              self.redirect_depth
          }

'''
          if 'pub fn binding_hash(&self)' not in text:
              if marker not in text:
                  raise SystemExit('TLS grant getter marker was not found')
              model.write_text(text.replace(marker, marker + getters, 1))
          PY
          cargo fmt --all
          rm -rf .p0p3 .github/workflows/nxb-p0-p3-bootstrap.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P0-P3: materialize networkless analysis batch'
          git push origin HEAD:nxb-p0-p3-networkless-analysis-batch

  rust:
    name: Rust contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features
