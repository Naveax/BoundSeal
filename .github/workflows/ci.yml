name: CI

on:
  push:
    branches:
      - main
      - "nxb-**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-lockfile:
    name: Materialize lockfile once
    if: github.ref == 'refs/heads/nxb-120-post-program-maintenance-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: nxb-120-post-program-maintenance-contracts
          fetch-depth: 0

      - name: Install pinned Rust
        run: rustup show active-toolchain

      - name: Generate and verify lockfile
        run: |
          cargo generate-lockfile
          cargo check --workspace --all-features --locked
          cargo fmt --all

      - name: Restore permanent CI
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('.github/workflows/ci.yml').write_bytes(base64.b64decode(''))
          PY

      - name: Commit lockfile and permanent CI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/ci.yml crates/nxb-core/src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: lock contract-complete dependency graph'
          git push origin HEAD:nxb-120-post-program-maintenance-contracts
