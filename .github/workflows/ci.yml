name: CI

on:
  push:
    branches:
      - main
      - "nxb-**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust
        run: rustup show active-toolchain

      - name: Lockfile
        run: cargo check --workspace --all-features --locked

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features --locked

      - name: Synthetic system demo
        run: |
          cargo run -p nxb-core --locked -- demo-run --output target/nxb-demo-receipt.json
          cargo run -p nxb-core --locked -- verify-demo target/nxb-demo-receipt.json

  supply-chain:
    name: Dependency policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust
        run: rustup show active-toolchain

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: RustSec audit
        run: cargo audit --deny warnings

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.7

      - name: Dependency policy
        run: cargo deny check
