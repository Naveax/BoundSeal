name: CI

on:
  push:
    branches:
      - main
      - "nxb-**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-private-manifests:
    name: Normalize private manifests once
    if: github.ref == 'refs/heads/nxb-120-post-program-maintenance-contracts' || github.head_ref == 'nxb-120-post-program-maintenance-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v7
        with:
          ref: nxb-120-post-program-maintenance-contracts
          fetch-depth: 0

      - name: Normalize package metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = 0
          for manifest in sorted(Path("crates").glob("*/Cargo.toml")):
              text = manifest.read_text()
              package_start = text.find("[package]")
              package_end = text.find("\n[", package_start + len("[package]"))
              if package_end == -1:
                  package_end = len(text)
              package = text[package_start:package_end]
              if "publish =" not in package:
                  insert_after = "authors.workspace = true"
                  if insert_after not in package:
                      raise SystemExit(f"authors marker missing in {manifest}")
                  text = text.replace(insert_after, insert_after + "\npublish = false", 1)
                  manifest.write_text(text)
                  changed += 1
          print(f"normalized {changed} private manifests")
          PY

      - name: Verify workspace metadata
        run: |
          cargo metadata --locked --no-deps --format-version 1 > /tmp/metadata.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/metadata.json"))
          bad = [p["name"] for p in data["packages"] if p.get("publish") != []]
          if bad:
              raise SystemExit(f"publishable workspace packages remain: {bad}")
          print(f"verified {len(data['packages'])} private packages")
          PY

      - name: Commit normalized manifests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/*/Cargo.toml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: mark all workspace crates private'
          git pull --rebase origin nxb-120-post-program-maintenance-contracts
          git push origin HEAD:nxb-120-post-program-maintenance-contracts
