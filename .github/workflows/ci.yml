name: CI

on:
  push:
    branches:
      - main
      - "nxb-**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-p16-p18:
    name: Materialize P16-P18 once
    if: github.ref == 'refs/heads/nxb-102-post-lifecycle-evolution-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect payload
        id: payload
        run: |
          if compgen -G '.p16p18/chunk-*' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install stable Rust
        if: steps.payload.outputs.present == 'true'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Verify and materialize
        if: steps.payload.outputs.present == 'true'
        run: |
          cat $(find .p16p18 -type f -name 'chunk-*' | sort) | base64 -d > /tmp/p16p18.tar.gz
          echo 'b04cf31e08a4e968bd6b47adc02b4728a21e3f9b94cba88ef6b5ef2d0efc1191  /tmp/p16p18.tar.gz' | sha256sum -c -
          tar -xzf /tmp/p16p18.tar.gz -C .
          cargo fmt --all
          rm -rf .p16p18
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit materialized architecture
        if: steps.payload.outputs.present == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'P16-P18: materialize evolution governance architecture'
          git push origin HEAD:nxb-102-post-lifecycle-evolution-contracts

  rust:
    name: Rust contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features
