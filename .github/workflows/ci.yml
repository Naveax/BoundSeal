name: CI

on:
  push:
    branches:
      - main
      - "nxb-**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-post-closure:
    name: Materialize P16-P18 post-closure governance
    if: (github.event_name == 'push' && github.ref_name == 'nxb-102-successor-renewal-and-program-closure') || (github.event_name == 'pull_request' && github.head_ref == 'nxb-102-successor-renewal-and-program-closure')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Verify and materialize payload
        run: |
          cat .bootstrap/p16-p18.part* | base64 -d > /tmp/p16-p18.tar.bz2
          echo "1bd4ec2a8852417f6d9d62d5a5d964e6db9bcfa7c32c36d941e2db189351e0e2  /tmp/p16-p18.tar.bz2" | sha256sum -c -
          bzip2 -t /tmp/p16-p18.tar.bz2
          if tar -tjf /tmp/p16-p18.tar.bz2 | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "unsafe archive path"
            exit 1
          fi
          tar -xjf /tmp/p16-p18.tar.bz2 -C .
          find crates/nxb-post-closure-governance/src -name '*.rs' -print0 | xargs -0 rustfmt --edition 2021
          cargo fmt --all

      - name: Remove bootstrap material
        run: |
          rm -rf .bootstrap
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml

      - name: Commit permanent architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "NXB P16-P18: materialize post-closure governance"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  rust:
    name: Rust contract checks
    if: github.head_ref != 'nxb-102-successor-renewal-and-program-closure' && github.ref_name != 'nxb-102-successor-renewal-and-program-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features
