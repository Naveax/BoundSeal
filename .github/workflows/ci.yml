name: CI

on:
  push:
    branches:
      - main
      - "nxb-**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-platform-assurance:
    name: Format platform assurance fragments
    if: github.event_name == 'push' && github.ref_name == 'nxb-66-platform-integration-fixtures'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: nxb-66-platform-integration-fixtures
          fetch-depth: 0

      - name: Install rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Format, restore CI and push
        run: |
          find crates/nxb-platform-assurance/src -type f -name '*.rs' -print0 | xargs -0 -n1 rustfmt --edition 2021
          git checkout origin/main -- .github/workflows/ci.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nxb-platform-assurance/src .github/workflows/ci.yml
          git commit -m "Format P10-P12 platform assurance sources"
          git push origin HEAD:nxb-66-platform-integration-fixtures

  rust:
    name: Rust contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features
