name: CI

on:
  push:
    branches:
      - main
      - "nxb-**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nxb137-expiry-hardening:
    name: NXB-137 per-request expiry hardening
    if: github.event_name == 'pull_request' && github.head_ref == 'nxb-137-signed-bounded-discovery-session'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: nxb-137-signed-bounded-discovery-session

      - name: Apply elapsed-time security checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          live = Path("crates/nxb-core/src/discovery_session_live.rs")
          text = live.read_text()
          if "pub dns_observation_elapsed: Duration," not in text:
              old = "    pub dns_ttl_seconds: u32,\n    pub maximum_response_body_bytes: u64,"
              if old not in text:
                  raise SystemExit("request-spec field marker did not match")
              text = text.replace(
                  old,
                  "    pub dns_ttl_seconds: u32,\n    pub dns_observation_elapsed: Duration,\n    pub maximum_response_body_bytes: u64,",
                  1,
              )

              dns_marker = '''        if self.dns_context_id.is_empty()
                      || self.dns_resolver_id.is_empty()
                      || self.dns_ttl_seconds == 0
                      || self.dns_ttl_seconds > 86_400
                  {
                      bail!("discovery-session DNS metadata is invalid");
                  }'''
              if dns_marker not in text:
                  raise SystemExit("DNS validation block did not match")
              text = text.replace(
                  dns_marker,
                  dns_marker
                  + '''
                  if self.dns_observation_elapsed
                      > Duration::from_secs(u64::from(self.dns_ttl_seconds))
                  {
                      bail!("signed discovery-session DNS observation has expired");
                  }''',
                  1,
              )

              pattern = re.compile(
                  r'''    let authorization =\s*\n\s*transport\.authorize_connection\(&intent, spec\.selected_ip, Duration::ZERO\)\?;'''
              )
              text, count = pattern.subn(
                  '''    let authorization = transport.authorize_connection(
                      &intent,
                      spec.selected_ip,
                      spec.dns_observation_elapsed,
                  )?;''',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("transport authorization block did not match")

              text += '''

          #[cfg(test)]
          mod tests {
              use super::*;

              fn spec(elapsed: Duration) -> DiscoverySessionRequestSpec {
                  DiscoverySessionRequestSpec {
                      target_url: Url::parse("https://example.com/app/").unwrap(),
                      method: PlannedMethod::Get,
                      selected_ip: "93.184.216.34".parse().unwrap(),
                      resolved_ips: BTreeSet::from(["93.184.216.34".parse().unwrap()]),
                      dns_context_id: "dns-context-expiry-test".into(),
                      dns_resolver_id: "signed-dns-observation".into(),
                      dns_ttl_seconds: 60,
                      dns_observation_elapsed: elapsed,
                      maximum_response_body_bytes: 1024,
                  }
              }

              #[test]
              fn request_spec_rejects_expired_dns_observation() {
                  spec(Duration::from_secs(60)).validate().unwrap();
                  assert!(spec(Duration::from_secs(61)).validate().is_err());
              }
          }
          '''
              live.write_text(text)

          binary = Path("crates/nxb-core/src/bin/nxb-discovery-session.rs")
          text = binary.read_text()
          if "time::{Duration, Instant}" not in text:
              import_marker = "use std::{collections::BTreeMap, path::Path, thread, time::Duration};"
              if import_marker not in text:
                  raise SystemExit("live std import marker did not match")
              text = text.replace(
                  import_marker,
                  '''use std::{
                      collections::BTreeMap,
                      path::Path,
                      thread,
                      time::{Duration, Instant},
                  };''',
                  1,
              )

              text, count = re.subn(
                  r'''    let artifacts = execute_session\(&policy_bytes, &compiled, &plan, config, now\)\?;''',
                  '''    let artifacts = execute_session(
                      &policy_bytes,
                      &compiled,
                      &plan,
                      activation.payload.expires_at_epoch_seconds,
                      config,
                      now,
                  )?;''',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("execute_session call did not match")

              text, count = re.subn(
                  r'''fn execute_session\(\s*\n\s*policy_bytes: &\[u8\],\s*\n\s*policy: &CompiledPolicy,\s*\n\s*plan: &DiscoverySessionPlan,\s*\n\s*config: OperatorConfig,\s*\n\s*now: DateTime<Utc>,\s*\n\) -> Result<SessionArtifacts> \{''',
                  '''fn execute_session(
                      policy_bytes: &[u8],
                      policy: &CompiledPolicy,
                      plan: &DiscoverySessionPlan,
                      activation_expires_at_epoch_seconds: i64,
                      config: OperatorConfig,
                      now: DateTime<Utc>,
                  ) -> Result<SessionArtifacts> {''',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("execute_session signature did not match")

              seed_marker = "    let seed = plan.seed()?;\n    let mut scheduler"
              if seed_marker not in text:
                  raise SystemExit("session-start marker did not match")
              text = text.replace(
                  seed_marker,
                  "    let seed = plan.seed()?;\n    let session_started = Instant::now();\n    let mut scheduler",
                  1,
              )

              loop_start = text.index("    while let Some(candidate) = scheduler.next_candidate() {")
              body_limit_marker = "        let maximum_response_body_bytes"
              insert_at = text.index(body_limit_marker, loop_start)
              expiry_block = '''        let elapsed = session_started.elapsed();
                  let request_now = now
                      + chrono::Duration::from_std(elapsed)
                          .context("discovery-session elapsed time exceeded chrono bounds")?;
                  plan.verify(request_now)?;
                  if request_now.timestamp() > activation_expires_at_epoch_seconds {
                      bail!("discovery-session activation expired before the next request");
                  }
          '''
              text = text[:insert_at] + expiry_block + text[insert_at:]

              spec_marker = "                dns_ttl_seconds: plan.dns_ttl_seconds,\n                maximum_response_body_bytes,"
              if spec_marker not in text:
                  raise SystemExit("request-spec construction marker did not match")
              text = text.replace(
                  spec_marker,
                  "                dns_ttl_seconds: plan.dns_ttl_seconds,\n                dns_observation_elapsed: elapsed,\n                maximum_response_body_bytes,",
                  1,
              )

              execute_start = text.index("        let observation = execute_discovery_session_request(", loop_start)
              now_index = text.index("            now,", execute_start)
              text = text[:now_index] + "            request_now," + text[now_index + len("            now,"):]
              binary.write_text(text)
          PY
          cargo fmt --all

      - name: Commit elapsed-time hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/nxb-core/src/discovery_session_live.rs crates/nxb-core/src/bin/nxb-discovery-session.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "NXB-137: enforce per-request TTL and authorization expiry"
          git push origin HEAD:nxb-137-signed-bounded-discovery-session

  rust:
    name: Rust contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust
        run: rustup show active-toolchain

      - name: Lockfile
        run: cargo check --workspace --all-features --locked

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features --locked

      - name: Synthetic system demo
        run: |
          cargo run -p nxb-core --bin nxb --locked -- demo-run --output target/nxb-demo-receipt.json
          cargo run -p nxb-core --bin nxb --locked -- verify-demo target/nxb-demo-receipt.json

  supply-chain:
    name: Dependency policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust
        run: rustup show active-toolchain

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: RustSec audit
        run: cargo audit --deny warnings

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.7

      - name: Dependency policy
        run: cargo deny check