name: CI

on:
  push:
    branches:
      - main
      - "nxb-**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-artifact:
    name: Generate verified lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        run: rustup show active-toolchain

      - name: Generate and verify lockfile
        run: |
          cargo generate-lockfile
          cargo check --workspace --all-features --locked

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: nxb-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

  rust:
    name: Rust contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        run: rustup show active-toolchain

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Synthetic system demo
        run: |
          cargo run -p nxb-core -- demo-run --output target/nxb-demo-receipt.json
          cargo run -p nxb-core -- verify-demo target/nxb-demo-receipt.json
