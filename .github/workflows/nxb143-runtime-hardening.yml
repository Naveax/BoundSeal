name: NXB-143 authenticated runtime hardening

on:
  push:
    branches:
      - main
      - nxb-143-checkpoint-bound-authenticated-runtime
  pull_request:
    paths:
      - "crates/nxb-operator-runtime/**"
      - "crates/nxb-operator-state/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/nxb143-runtime-hardening.yml"

permissions:
  contents: read

concurrency:
  group: nxb143-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contract:
    name: Runtime contract, Clippy and recovery tests
    runs-on: ubuntu-slim
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Canonical lockfile and formatting
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.expected
          cargo generate-lockfile
          cmp Cargo.lock /tmp/Cargo.lock.expected
          cargo fmt --all -- --check
      - name: Runtime check
        run: cargo check -p nxb-operator-runtime --all-features --locked
      - name: Runtime Clippy
        run: cargo clippy -p nxb-operator-runtime --all-targets --all-features --locked -- -D warnings
      - name: Runtime and state tests
        run: |
          cargo test -p nxb-operator-state --all-features --locked -- --test-threads=1
          cargo test -p nxb-operator-runtime --all-features --locked -- --test-threads=1

  runtime-windows:
    name: Runtime recovery tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Runtime and state tests
        shell: pwsh
        run: |
          cargo test -p nxb-operator-state --all-features --locked -- --test-threads=1
          cargo test -p nxb-operator-runtime --all-features --locked -- --test-threads=1
