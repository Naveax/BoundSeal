name: NXB-143 PR materialization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: nxb143-pr-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'nxb-143-checkpoint-bound-authenticated-runtime' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 50
    steps:
      - name: Checkout exact product branch
        uses: actions/checkout@v7
        with:
          ref: nxb-143-checkpoint-bound-authenticated-runtime
          fetch-depth: 0

      - name: Materialize workspace and harden state/runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('Cargo.toml')
          text = root.read_text(encoding='utf-8')
          member = '    "crates/nxb-operator-runtime",\n'
          if member not in text:
              anchor = '    "crates/nxb-operator",\n'
              if text.count(anchor) != 1:
                  raise SystemExit('unexpected workspace anchor')
              text = text.replace(anchor, anchor + member, 1)
          root.write_text(text, encoding='utf-8', newline='\n')

          state_path = Path('crates/nxb-operator-state/src/lib.rs')
          state = state_path.read_text(encoding='utf-8')

          if 'NonCanonicalCheckpoint' not in state:
              pattern = re.compile(
                  r'(let checkpoint: OperatorCheckpoint = serde_json::from_slice\(&bytes\)\n'
                  r'\s*\.map_err\(\|error\| OperatorStateError::Serialization\(error\.to_string\(\)\)\)\?;\n)'
                  r'(\s*if checkpoint\.sequence != sequence \{)'
              )
              replacement = (
                  r'\1'
                  '            if bytes != checkpoint_bytes(&checkpoint)? {\n'
                  '                return Err(OperatorStateError::NonCanonicalCheckpoint);\n'
                  '            }\n'
                  r'\2'
              )
              state, count = pattern.subn(replacement, state, count=1)
              if count != 1:
                  raise SystemExit('checkpoint parse anchor not found')

          state = re.sub(
              r'\n\s*\| \(OperatorRunStatus::Running, OperatorRunStatus::Completed\)',
              '',
              state,
              count=1,
          )

          if 'checkpoint bytes are not in canonical serialized form' not in state:
              anchor = (
                  '    #[error("checkpoint SHA-256 does not match its contents")]\n'
                  '    CheckpointDigestMismatch,\n'
              )
              if state.count(anchor) != 1:
                  raise SystemExit('checkpoint error anchor not found')
              state = state.replace(
                  anchor,
                  anchor
                  + '    #[error("checkpoint bytes are not in canonical serialized form")]\n'
                  + '    NonCanonicalCheckpoint,\n',
                  1,
              )

          if 'fn noncanonical_checkpoint_bytes_are_rejected()' not in state:
              anchor = '    #[test]\n    fn interrupted_publication_is_rejected() {\n'
              if state.count(anchor) != 1:
                  raise SystemExit('state test anchor not found')
              tests = '''    #[test]
    fn noncanonical_checkpoint_bytes_are_rejected() {
        let (root, store) = initialized_store("noncanonical", 1024 * 1024);
        let path = store.directory().join(checkpoint_file_name(0));
        let mut bytes = fs::read(&path).expect("read checkpoint");
        bytes.push(b'\\n');
        fs::write(&path, bytes).expect("rewrite checkpoint");
        assert!(matches!(
            store.recover(1_200).expect_err("noncanonical bytes must fail"),
            OperatorStateError::NonCanonicalCheckpoint
        ));
        fs::remove_dir_all(root).expect("cleanup");
    }

    #[test]
    fn completion_requires_teardown_checkpoint() {
        let (root, store) = initialized_store("teardown-order", 1024 * 1024);
        store
            .append(
                CheckpointUpdate {
                    status: OperatorRunStatus::Running,
                    counters: OperatorCounters::default(),
                    stop_reason: None,
                },
                1_150,
            )
            .expect("enter running state");
        assert!(matches!(
            store
                .append(
                    CheckpointUpdate {
                        status: OperatorRunStatus::Completed,
                        counters: OperatorCounters::default(),
                        stop_reason: Some("completed".into()),
                    },
                    1_160,
                )
                .expect_err("direct completion must fail"),
            OperatorStateError::InvalidStatusTransition
        ));
        store
            .append(
                CheckpointUpdate {
                    status: OperatorRunStatus::TeardownPending,
                    counters: OperatorCounters::default(),
                    stop_reason: Some("teardown started".into()),
                },
                1_170,
            )
            .expect("enter teardown");
        store
            .append(
                CheckpointUpdate {
                    status: OperatorRunStatus::Completed,
                    counters: OperatorCounters::default(),
                    stop_reason: Some("teardown completed".into()),
                },
                1_180,
            )
            .expect("complete after teardown");
        fs::remove_dir_all(root).expect("cleanup");
    }

'''
              state = state.replace(anchor, tests + anchor, 1)
          state_path.write_text(state, encoding='utf-8', newline='\n')

          runtime_path = Path('crates/nxb-operator-runtime/src/lib.rs')
          runtime = runtime_path.read_text(encoding='utf-8')
          loop_anchor = (
              '    let mut unresolved = None;\n'
              '    let mut reconcile = None;\n'
              '    for (expected, (index, paths)) in records.into_iter().enumerate() {\n'
          )
          if 'let mut incomplete_seen = false;' not in runtime:
              if runtime.count(loop_anchor) != 1:
                  raise SystemExit('runtime journal loop anchor not found')
              runtime = runtime.replace(
                  loop_anchor,
                  '    let mut unresolved = None;\n'
                  '    let mut reconcile = None;\n'
                  '    let mut incomplete_seen = false;\n'
                  '    for (expected, (index, paths)) in records.into_iter().enumerate() {\n'
                  '        if incomplete_seen {\n'
                  '            return Err(RuntimeError::StateJournalMismatch);\n'
                  '        }\n',
                  1,
              )
          block = re.compile(
              r'\n\s*if unresolved\.is_some\(\) \|\| reconcile\.is_some\(\) \{\n'
              r'.*?\n\s*\}\n'
              r'\s*\}\n',
              re.DOTALL,
          )
          if 'incomplete_seen = unresolved.is_some() || reconcile.is_some();' not in runtime:
              runtime, count = block.subn(
                  '\n        incomplete_seen = unresolved.is_some() || reconcile.is_some();\n',
                  runtime,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('runtime incomplete block not found')
          runtime = re.sub(
              r'\nfn records_len_hint\(.*?\n\}\n\n(?=#\[derive\(Debug, Clone, Copy\)\]\nenum RecordKind)',
              '\n',
              runtime,
              count=1,
              flags=re.DOTALL,
          )
          runtime_path.write_text(runtime, encoding='utf-8', newline='\n')
          PY

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Canonicalize and validate product tree
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-features --locked
          cargo clippy -p nxb-operator-state -p nxb-operator-runtime --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-operator-state -p nxb-operator-runtime --all-features --locked -- --test-threads=1
          git diff --check

      - name: Commit validated runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/nxb143-materialize.yml .github/workflows/nxb143-pr-materialize.yml
          git add Cargo.toml Cargo.lock crates/nxb-operator-state crates/nxb-operator-runtime
          git commit -m "NXB-143: materialize checkpoint-bound runtime"
          git push origin HEAD:nxb-143-checkpoint-bound-authenticated-runtime
