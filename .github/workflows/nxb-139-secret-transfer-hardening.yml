name: NXB-139 secret-transfer hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    name: Eliminate transient secret copies
    runs-on: ubuntu-slim
    timeout-minutes: 45

    steps:
      - name: Checkout NXB-139 branch
        uses: actions/checkout@v7
        with:
          ref: nxb-139-external-vault-provider-lifecycle
          fetch-depth: 0

      - name: Apply exact zeroization hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          vault = Path('crates/nxb-vault/src/lib.rs')
          text = vault.read_text(encoding='utf-8')
          old = 'use zeroize::Zeroizing;'
          new = 'use zeroize::{Zeroize, Zeroizing};'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected zeroize import count: {text.count(old)}')
          text = text.replace(old, new, 1)
          marker = '''impl fmt::Debug for SecretInput {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter
                      .debug_struct("SecretInput")
                      .field("kind", &self.kind)
                      .field("value", &"<redacted>")
                      .field("value_bytes", &self.value.len())
                      .field("binding", &self.binding)
                      .field("delivery", &self.delivery)
                      .field("expires_at_epoch_seconds", &self.expires_at_epoch_seconds)
                      .finish()
              }
          }
          '''
          replacement = marker + '''
          impl Drop for SecretInput {
              fn drop(&mut self) {
                  self.value.zeroize();
              }
          }
          '''
          if text.count(marker) != 1:
              raise SystemExit(f'unexpected SecretInput debug block count: {text.count(marker)}')
          text = text.replace(marker, replacement, 1)
          old = '                delivery: input.delivery,'
          new = '                delivery: input.delivery.clone(),'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected SecretInput delivery move count: {text.count(old)}')
          vault.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          lifecycle = Path('crates/nxb-vault-provider/src/lifecycle.inc.rs')
          text = lifecycle.read_text(encoding='utf-8')
          old = '            let material = provider.fetch(&mut provider_session, &request).map_err(|failure| {'
          new = '            let mut material = provider.fetch(&mut provider_session, &request).map_err(|failure| {'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected provider material binding count: {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '                    value: material.value.to_vec(),'
          new = '                    value: std::mem::take(&mut *material.value),'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected provider value copy count: {text.count(old)}')
          lifecycle.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          fi
          source "$HOME/.cargo/env" 2>/dev/null || true
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Verify hardening
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" 2>/dev/null || true
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-vault -p nxb-vault-provider --all-features --locked
          git diff --check

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nxb-vault/src/lib.rs crates/nxb-vault-provider/src/lifecycle.inc.rs
          git commit -m "fix: zeroize external secret transfer paths"
          git push origin HEAD:nxb-139-external-vault-provider-lifecycle
