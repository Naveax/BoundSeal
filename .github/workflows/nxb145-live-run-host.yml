name: NXB-145 signed live-run host

on:
  push:
    branches:
      - main
      - nxb-145-signed-live-run-host
  pull_request:
    paths:
      - "crates/nxb-live-run-host/**"
      - "crates/nxb-resumable-runner/**"
      - "crates/nxb-operator-runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/NXB-145-SIGNED-LIVE-RUN-HOST.md"
      - ".github/workflows/nxb145-live-run-host.yml"

permissions:
  contents: write

concurrency:
  group: nxb145-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-contract:
    name: Launch contract, host lifecycle and fail-closed tests
    runs-on: ubuntu-slim
    timeout-minutes: 35
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Generate canonical lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
      - name: Commit canonical lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "NXB-146: canonical Cargo.lock"
          git push origin HEAD:nxb-146-signed-run-closure-final
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Host and upstream check
        run: cargo check -p nxb-live-run-host -p nxb-resumable-runner -p nxb-operator-runtime --all-features --locked
      - name: Host and upstream Clippy
        run: cargo clippy -p nxb-live-run-host -p nxb-resumable-runner -p nxb-operator-runtime --all-targets --all-features --locked -- -D warnings
      - name: Host and upstream tests
        run: cargo test -p nxb-live-run-host -p nxb-resumable-runner -p nxb-operator-runtime --all-features --locked -- --test-threads=1

  host-windows:
    name: Launch and lifecycle tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Host and upstream tests
        shell: pwsh
        run: cargo test -p nxb-live-run-host -p nxb-resumable-runner -p nxb-operator-runtime --all-features --locked -- --test-threads=1
