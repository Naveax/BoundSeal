name: NXB-144 one-shot materialization

on:
  push:
    branches:
      - nxb-144-resumable-bounded-live-runner
  pull_request:
    paths:
      - ".github/nxb144_materialize.py"
      - ".github/nxb144_payload_*.txt"
      - ".github/nxb144_test_fix.py"
      - ".github/workflows/nxb144-materialize.yml"

permissions:
  contents: write

concurrency:
  group: nxb144-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    name: Materialize and validate resumable runner
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 55
    steps:
      - name: Checkout exact product branch
        uses: actions/checkout@v7
        with:
          ref: nxb-144-resumable-bounded-live-runner
          fetch-depth: 0
      - name: Materialize NXB-144 tree
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/nxb144_materialize.py
          python3 .github/nxb144_test_fix.py
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Canonicalize and validate product tree
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-features --locked
          cargo clippy -p nxb-operator-runtime -p nxb-resumable-runner --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-operator-runtime -p nxb-resumable-runner --all-features --locked -- --test-threads=1
          git diff --check
      - name: Commit validated source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/nxb144_materialize.py .github/nxb144_payload_00.txt .github/nxb144_payload_01.txt .github/nxb144_payload_02.txt .github/nxb144_payload_03.txt .github/nxb144_test_fix.py
          rm .github/workflows/nxb144-resumable-runner.yml
          git add Cargo.toml Cargo.lock crates/nxb-operator-runtime crates/nxb-resumable-runner docs/NXB-144-RESUMABLE-BOUNDED-LIVE-RUNNER.md
          git commit -m "NXB-144: materialize resumable bounded live runner"
          git push origin HEAD:nxb-144-resumable-bounded-live-runner
