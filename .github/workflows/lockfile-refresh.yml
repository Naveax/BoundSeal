name: Lockfile verification

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - ".github/workflows/lockfile-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Generate canonical lockfile
        run: cargo generate-lockfile
      - name: Upload canonical lockfile evidence
        uses: actions/upload-artifact@v4
        with:
          name: canonical-cargo-lock-${{ github.run_id }}
          path: Cargo.lock
          retention-days: 3
      - name: Require committed lockfile to match
        run: git diff --exit-code -- Cargo.lock
