name: Operator finding validation one-shot

on:
  pull_request:
    branches:
      - nxb-130-local-adversarial-integration-lab
    paths:
      - "crates/nxb-operator/**"
      - "crates/nxb-core/**"
      - ".github/workflows/operator-finding-validation-once.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'nxb-131-135-product-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source branch
        uses: actions/checkout@v7
        with:
          ref: nxb-131-135-product-integration
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Add fail-closed finding validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path("crates/nxb-operator/src/lib.rs")
          text = lib.read_text()
          start = text.index("impl OperatorFinding {")
          end = text.index("\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]\npub struct RootCauseGroup", start)
          replacement = r'''impl OperatorFinding {
              pub fn validate(&self) -> Result<(), OperatorError> {
                  validate_identifier(&self.finding_id, "finding_id")?;
                  validate_identifier(&self.rule_id, "rule_id")?;
                  validate_report_text(&self.title, "finding title")?;
                  validate_report_text(&self.summary, "finding summary")?;
                  validate_sha256(&self.endpoint_sha256, "finding endpoint")?;
                  validate_sha256(&self.evidence_sha256, "finding evidence")?;

                  let parsed_origin = Url::parse(&self.origin).map_err(|error| {
                      OperatorError::InvalidReport(format!("finding origin is invalid: {error}"))
                  })?;
                  if parsed_origin.scheme() != "https"
                      || parsed_origin.host_str().is_none()
                      || !parsed_origin.username().is_empty()
                      || parsed_origin.password().is_some()
                      || parsed_origin.query().is_some()
                      || parsed_origin.fragment().is_some()
                      || parsed_origin.path() != "/"
                      || parsed_origin.port_or_known_default().is_none()
                  {
                      return Err(OperatorError::InvalidReport(
                          "finding origin must be an HTTPS origin without credentials, path, query, or fragment"
                              .into(),
                      ));
                  }

                  if self.affected_endpoints.is_empty()
                      || self.affected_endpoints.len() > MAX_OPERATOR_ENDPOINTS as usize
                      || !self.affected_endpoints.contains(&self.endpoint_sha256)
                  {
                      return Err(OperatorError::InvalidReport(
                          "finding affected endpoints are empty, oversized, or omit the primary endpoint"
                              .into(),
                      ));
                  }
                  for endpoint in &self.affected_endpoints {
                      validate_sha256(endpoint, "affected endpoint")?;
                  }
                  validate_metadata(&self.reproduction_metadata)?;
                  Ok(())
              }

              pub fn from_passive(finding: &Finding) -> Result<Self, OperatorError> {
                  let mut reproduction_metadata = finding.metadata.clone();
                  reproduction_metadata.insert("source".into(), "passive_analyzer".into());
                  let operator_finding = Self {
                      finding_id: finding.finding_id.clone(),
                      rule_id: finding.rule_id.clone(),
                      title: finding.title.clone(),
                      severity: finding.severity,
                      confidence: finding.confidence,
                      origin: finding.origin.clone(),
                      endpoint_sha256: finding.endpoint_sha256.clone(),
                      evidence_sha256: finding.evidence_sha256.clone(),
                      summary: finding.summary.clone(),
                      disposition: FindingDisposition::Candidate,
                      affected_endpoints: BTreeSet::from([finding.endpoint_sha256.clone()]),
                      reproduction_metadata,
                  };
                  operator_finding.validate()?;
                  Ok(operator_finding)
              }
          }
          '''
          text = text[:start] + replacement + text[end:]

          needle = '''        for area in &untested_areas {
                      validate_report_text(area, "untested area")?;
                  }
                  let mut findings = findings;
          '''
          replacement = '''        for area in &untested_areas {
                      validate_report_text(area, "untested area")?;
                  }
                  for finding in &findings {
                      finding.validate()?;
                  }
                  let mut findings = findings;
          '''
          if needle not in text:
              raise SystemExit("operator report build insertion point not found")
          text = text.replace(needle, replacement, 1)
          lib.write_text(text)

          test = Path("crates/nxb-operator/tests/hardening.rs")
          test_text = test.read_text()
          test_start = test_text.index("#[test]\nfn secret_like_report_material_")
          test_end = test_text.index("\n#[test]\nfn stale_temporary_export", test_start)
          test_replacement = r'''#[test]
          fn secret_like_report_material_is_rejected_before_report_build() {
              let error = fixture_report("Authorization: Bearer should-never-be-exported")
                  .expect_err("secret-like material must never enter an operator report");
              assert!(error.to_string().contains("secret-like"));
          }
          '''
          test_text = test_text[:test_start] + test_replacement + test_text[test_end:]
          test.write_text(test_text)
          PY
      - name: Canonicalize and verify
        run: |
          cargo fmt --all
          cargo test -p nxb-operator --locked -- --test-threads=1
          cargo test -p nxb-core --locked -- --test-threads=1
      - name: Commit verified patch
        run: |
          if git diff --quiet; then
            echo "Finding validation patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nxb-operator crates/nxb-core
          git commit -m "fix: validate findings before report construction"
          git push origin HEAD:nxb-131-135-product-integration
