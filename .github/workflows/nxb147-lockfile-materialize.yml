name: NXB-147 temporary lockfile materializer

on:
  push:
    branches:
      - nxb-147-signed-manual-submission-handoff
    paths:
      - ".github/workflows/nxb147-lockfile-materialize.yml"
      - "crates/nxb-manual-submission-handoff/Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: write

concurrency:
  group: nxb147-lockfile-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nxb-147-signed-manual-submission-handoff
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Generate canonical lockfile
        run: cargo generate-lockfile
      - name: Commit only Cargo.lock when changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          test "$(git diff --cached --name-only)" = "Cargo.lock"
          git commit -m "NXB-147: refresh canonical Cargo.lock for tests"
          git push origin HEAD:nxb-147-signed-manual-submission-handoff
