name: NXB-142 full verification

on:
  push:
    branches:
      - main
      - nxb-142-checkpointed-bounded-operator-state
  pull_request:

permissions:
  contents: read

concurrency:
  group: nxb142-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Canonical lockfile and full workspace
    runs-on: ubuntu-slim
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Verify canonical lockfile
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.expected
          cargo generate-lockfile
          cmp Cargo.lock /tmp/Cargo.lock.expected
      - name: Formatting and workspace check
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --all-features --locked
      - name: All-target Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Full workspace tests
        run: cargo test --workspace --all-features --locked -- --test-threads=1
      - name: Synthetic system demo
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p nxb-core --bin nxb --locked -- demo-run --output target/nxb-demo-receipt.json
          cargo run -p nxb-core --bin nxb --locked -- verify-demo target/nxb-demo-receipt.json

  supply-chain:
    name: RustSec and cargo-deny
    runs-on: ubuntu-slim
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: RustSec audit
        run: cargo audit --deny warnings
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.7
      - name: Dependency policy
        run: cargo deny check

  release-evidence:
    name: Release binary, SBOM and SHA-256 evidence
    runs-on: ubuntu-slim
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Build release binary
        run: cargo build -p nxb-core --release --locked
      - name: Generate dependency metadata
        run: cargo metadata --locked --format-version 1 > target/cargo-metadata.json
      - name: Generate deterministic CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          metadata = json.loads(Path("target/cargo-metadata.json").read_text())
          components = []
          for package in sorted(
              metadata["packages"], key=lambda item: (item["name"], item["version"], item["id"])
          ):
              source = package.get("source") or "workspace"
              component = {
                  "type": "library",
                  "bom-ref": package["id"],
                  "name": package["name"],
                  "version": package["version"],
                  "purl": f"pkg:cargo/{package['name']}@{package['version']}",
                  "properties": [
                      {"name": "nxb:source", "value": source},
                      {"name": "nxb:manifest_path", "value": package["manifest_path"]},
                  ],
              }
              if package.get("license"):
                  component["licenses"] = [{"expression": package["license"]}]
              components.append(component)

          serial_material = "\n".join(
              f"{item['name']}\0{item['version']}\0{item['bom-ref']}" for item in components
          ).encode()
          serial = hashlib.sha256(serial_material).hexdigest()
          sbom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.6",
              "serialNumber": f"urn:uuid:{serial[:8]}-{serial[8:12]}-{serial[12:16]}-{serial[16:20]}-{serial[20:32]}",
              "version": 1,
              "metadata": {
                  "component": {"type": "application", "name": "nxb", "version": "0.1.0"},
                  "properties": [
                      {"name": "nxb:network_activity", "value": "none"},
                      {"name": "nxb:source_sha", "value": "${{ github.sha }}"},
                  ],
              },
              "components": components,
          }
          output = Path("target/nxb142-release-evidence")
          output.mkdir(parents=True, exist_ok=True)
          (output / "nxb.cdx.json").write_text(json.dumps(sbom, indent=2, sort_keys=True) + "\n")
          PY
      - name: Collect binary and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp target/release/nxb target/nxb142-release-evidence/nxb-linux-x86_64
          cd target/nxb142-release-evidence
          sha256sum nxb-linux-x86_64 nxb.cdx.json | LC_ALL=C sort > SHA256SUMS
          sha256sum SHA256SUMS > SHA256SUMS.sha256
      - name: Reject accidental secret material
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIE 'authorization:|set-cookie:|bearer |password=|token=|private_key=' target/nxb142-release-evidence
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@v4
        with:
          name: nxb142-release-evidence-${{ github.run_id }}
          path: target/nxb142-release-evidence
          retention-days: 14
