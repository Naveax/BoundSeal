name: NXB-128 lockfile materializer

on:
  push:
    branches:
      - nxb-128-scope-controlled-live-passive-adapter
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nxb128-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: nxb-128-scope-controlled-live-passive-adapter
          fetch-depth: 0

      - name: Install pinned Rust
        run: rustup show active-toolchain

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Verify live adapter with locked dependencies
        run: cargo check -p nxb-live-adapter --all-features --locked

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Lock NXB-128 live adapter dependencies"
          git push origin HEAD:nxb-128-scope-controlled-live-passive-adapter
