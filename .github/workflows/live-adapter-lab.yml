name: Live adapter local adversarial lab

on:
  pull_request:
    paths:
      - "crates/nxb-live-adapter/**"
      - ".github/workflows/live-adapter-lab.yml"
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: live-adapter-lab-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  local-lab:
    name: Loopback TLS and HTTP adversarial scenarios
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.run_number == 851)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout NXB-130 branch
        uses: actions/checkout@v7
        with:
          ref: nxb-130-local-adversarial-integration-lab
          fetch-depth: 0

      - name: Install pinned Rust
        run: rustup show active-toolchain

      - name: Run loopback-only lab
        env:
          NXB130_TRANSCRIPT_PATH: target/nxb130-lab-transcript.json
        run: |
          cargo test -p nxb-live-adapter --locked adversarial_local_lab_produces_sanitized_transcript -- --nocapture --test-threads=1
          test -s target/nxb130-lab-transcript.json

      - name: Verify transcript contains no obvious secret or public-target material
        run: |
          ! grep -Eqi 'authorization|set-cookie|bearer |password=|token=|https?://' target/nxb130-lab-transcript.json

      - name: Commit sanitized transcript to NXB-130 branch
        run: |
          mkdir -p docs/evidence
          cp target/nxb130-lab-transcript.json docs/evidence/NXB-130-LAB-TRANSCRIPT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/NXB-130-LAB-TRANSCRIPT.json
          if git diff --cached --quiet; then
            echo "Transcript already committed."
          else
            git commit -m "NXB-130: record verified local lab transcript"
            git push origin HEAD:nxb-130-local-adversarial-integration-lab
          fi

      - name: Upload sanitized transcript
        uses: actions/upload-artifact@v4
        with:
          name: nxb-live-adapter-lab-transcript
          path: target/nxb130-lab-transcript.json
          if-no-files-found: error
          retention-days: 7
