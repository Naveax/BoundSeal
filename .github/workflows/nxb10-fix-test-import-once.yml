name: NXB-10 fix test import once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/nxb10-fix-test-import-once.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'nxb-10-origin-policy-and-redirect-isolation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Add response import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/nxb-redirect/tests/redirect.rs')
          text = path.read_text()
          old = 'use nxb_http1::{Http1Framing, Http1Header, Http1Version};\n'
          new = 'use nxb_http1::{Http1Framing, Http1Header, Http1Response, Http1Version};\n'
          if old not in text:
              raise SystemExit('HTTP response import marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rustup toolchain install stable --profile minimal --component rustfmt
          rustfmt --edition 2021 crates/nxb-redirect/tests/redirect.rs
          git rm .github/workflows/nxb10-fix-test-import-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nxb-redirect/tests/redirect.rs
          git commit -m "NXB-10: import HTTP redirect response fixture"
          git push origin HEAD:nxb-10-origin-policy-and-redirect-isolation
