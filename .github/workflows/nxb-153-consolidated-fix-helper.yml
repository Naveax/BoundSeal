name: NXB-153 Consolidated Fix Helper

on:
  push:
    branches:
      - nxb-153-consolidated-fix-1959453

permissions:
  contents: write

jobs:
  patch-format-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact helper head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=2 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Apply NXB-153 source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          authority = Path('scripts/nxb-153-rust-toolchain-authority.py')
          text = authority.read_text(encoding='utf-8')
          start = text.index('def self_test():\n')
          end = text.index('\n\ndef main():\n', start)
          replacement = '''def self_test():
              native_model = "windows" if os.name == "nt" else "linux"
              with tempfile.TemporaryDirectory(prefix="nxb-153-rust-tree-") as temporary:
                  base = pathlib.Path(temporary)
                  first = base / "first"
                  second = base / "second"
                  first.mkdir()
                  second.mkdir()
                  (first / "bin").mkdir()
                  (first / "lib").mkdir()
                  (first / "bin" / "rustc").write_bytes(b"rustc-bytes\\n")
                  (first / "lib" / "core.rlib").write_bytes(b"core-bytes\\n")
                  (second / "lib").mkdir()
                  (second / "bin").mkdir()
                  (second / "lib" / "core.rlib").write_bytes(b"core-bytes\\n")
                  (second / "bin" / "rustc").write_bytes(b"rustc-bytes\\n")

                  first_native = digest_tree(first, native_model)
                  second_native = digest_tree(second, native_model)
                  if first_native["tree_sha256"] != second_native["tree_sha256"]:
                      raise AuthorityError("self-test enumeration-order independence failed")

                  original = first_native["tree_sha256"]
                  (first / "lib" / "core.rlib").write_bytes(b"mutated\\n")
                  if digest_tree(first, native_model)["tree_sha256"] == original:
                      raise AuthorityError("self-test mutation did not change tree identity")

                  bounded = base / "bounded"
                  bounded.mkdir()
                  (bounded / "one").write_bytes(b"1")
                  (bounded / "two").write_bytes(b"2")
                  try:
                      digest_tree(bounded, native_model, max_files=1)
                  except AuthorityError:
                      pass
                  else:
                      raise AuthorityError("self-test file-count bound did not fail closed")
                  try:
                      digest_tree(bounded, native_model, max_total_bytes=1)
                  except AuthorityError:
                      pass
                  else:
                      raise AuthorityError("self-test total-byte bound did not fail closed")

                  directory_bound = base / "directory-bound"
                  directory_bound.mkdir()
                  (directory_bound / "child").mkdir()
                  (directory_bound / "child" / "file").write_bytes(b"x")
                  try:
                      digest_tree(directory_bound, native_model, max_directories=1)
                  except AuthorityError:
                      pass
                  else:
                      raise AuthorityError(
                          "self-test directory-count bound did not fail closed"
                      )

                  _, upper_key = windows_relative_bytes("Tool.exe")
                  _, lower_key = windows_relative_bytes("tool.exe")
                  if upper_key != lower_key:
                      raise AuthorityError(
                          "self-test Windows case-fold collision key was not canonical"
                      )
                  if os.name != "nt":
                      collision = base / "windows-collision"
                      collision.mkdir()
                      (collision / "Tool.exe").write_bytes(b"A")
                      (collision / "tool.exe").write_bytes(b"B")
                      try:
                          digest_tree(collision, "windows")
                      except AuthorityError:
                          pass
                      else:
                          raise AuthorityError(
                              "self-test Windows case collision was not rejected"
                          )

                  symlink_root = base / "symlink"
                  symlink_root.mkdir()
                  (symlink_root / "real").write_bytes(b"trusted")
                  try:
                      os.symlink("real", symlink_root / "alias")
                  except (OSError, NotImplementedError):
                      pass
                  else:
                      try:
                          digest_tree(symlink_root, native_model)
                      except AuthorityError:
                          pass
                      else:
                          raise AuthorityError(
                              "self-test symlink substitution was not rejected"
                          )
              print("NXB-153 host Rust toolchain tree authority self-test passed.")
          '''
          authority.write_text(text[:start] + replacement + text[end:], encoding='utf-8', newline='\n')

          replacement_path = Path('crates/nxb-core/src/workspace_authority_replacement.rs')
          text = replacement_path.read_text(encoding='utf-8')
          text = text.replace('const TRUSTED_MV: &str = "/usr/bin/mv";\n', '')
          method_start = text.index('    fn quarantine_no_replace(')
          method_end = text.index('    fn claim_prepared(', method_start)
          text = text[:method_start] + text[method_end:]
          text = text.replace(
              '    let quarantine_name = OsString::from(format!(".workspace.retired.{nonce}.json"));\n',
              '',
          )
          old = '''    if let Some(previous) = previous.as_ref() {
              before_quarantine()?;
              parent.validate_named_binding()?;
              parent.quarantine_no_replace(destination, &quarantine_name)?;
              parent.validate_child_binding(
                  &quarantine_name,
                  previous,
                  "quarantined previous document",
              )?;
          }

          parent.claim_prepared(&prepared, destination)?;'''
          new = '''    if let Some(previous) = previous.as_ref() {
              before_quarantine()?;
              parent.validate_named_binding()?;
              parent.validate_child_binding(destination, previous, "replacement destination")?;
              bail!(
                  "Linux replacement of an existing document is unsupported without exact-victim namespace mutation authority"
              );
          }

          parent.claim_prepared(&prepared, destination)?;'''
          if old not in text:
              raise SystemExit('existing-destination replacement block not found')
          text = text.replace(old, new, 1)

          test_start = text.index('    #[test]\n    fn replacement_publishes_exact_prepared_inode_and_retires_previous_inode()')
          test_end = text.index('    #[test]\n    fn parent_directory_replacement_cannot_redirect_namespace_mutation()', test_start)
          tests = '''    #[test]
              fn existing_destination_fails_closed_without_victim_mutation() {
                  let root = root("existing-fail-closed");
                  let destination = root.join("workspace.json");
                  fs::write(&destination, b"old\\n").unwrap();
                  fs::set_permissions(&destination, fs::Permissions::from_mode(0o600)).unwrap();

                  let error = replace_document(&destination, b"new\\n").unwrap_err();

                  assert!(error.to_string().contains(
                      "Linux replacement of an existing document is unsupported without exact-victim namespace mutation authority"
                  ));
                  assert_eq!(fs::read(&destination).unwrap(), b"old\\n");
                  assert!(!fs::read_dir(&root).unwrap().filter_map(|entry| entry.ok()).any(|entry| {
                      entry.file_name().to_string_lossy().starts_with(".workspace.retired.")
                  }));

                  fs::remove_dir_all(root).unwrap();
              }

              #[test]
              fn same_permission_destination_substitution_is_left_untouched() {
                  let root = root("race");
                  let destination = root.join("workspace.json");
                  let admitted = root.join("admitted.json");
                  fs::write(&destination, b"admitted\\n").unwrap();
                  fs::set_permissions(&destination, fs::Permissions::from_mode(0o600)).unwrap();

                  let error = replace_document_with_hook(&destination, b"candidate\\n", || {
                      fs::rename(&destination, &admitted)?;
                      fs::write(&destination, b"substituted\\n")?;
                      fs::set_permissions(&destination, fs::Permissions::from_mode(0o600))?;
                      Ok(())
                  })
                  .unwrap_err();

                  assert!(error
                      .to_string()
                      .contains("replacement destination pathname is not the retained file authority"));
                  assert_eq!(fs::read(&admitted).unwrap(), b"admitted\\n");
                  assert_eq!(fs::read(&destination).unwrap(), b"substituted\\n");
                  assert!(!fs::read_dir(&root).unwrap().filter_map(|entry| entry.ok()).any(|entry| {
                      entry.file_name().to_string_lossy().starts_with(".workspace.retired.")
                  }));

                  fs::remove_dir_all(root).unwrap();
              }

          '''
          text = text[:test_start] + tests + text[test_end:]
          replacement_path.write_text(text, encoding='utf-8', newline='\n')

          for doc_name in [
              'docs/NXB-153-PREPARED-FILE-AUTHORITY.md',
              'docs/NXB-153-DESTRUCTIVE-CLEANUP-AUTHORITY.md',
          ]:
              doc = Path(doc_name)
              body = doc.read_text(encoding='utf-8')
              marker = '## Linux existing-destination exact-victim boundary'
              if marker not in body:
                  body = body.rstrip() + '''\n\n## Linux existing-destination exact-victim boundary\n\nThe supported Linux source path does not claim an fd-relative exact-victim rename primitive that the current unprivileged design cannot provide. If the canonical replacement destination already exists, the Linux replacement authority validates the retained parent and retained destination binding and then fails closed before any victim rename, unlink, quarantine, overwrite, or replacement. A same-user substitution at the final component is therefore left untouched. Missing-destination publication remains create-only from the retained prepared file descriptor. Windows keeps its separate retained-handle `FileRenameInfo` replacement authority.\n'''
                  doc.write_text(body, encoding='utf-8', newline='\n')
          PY

          cat > crates/nxb-core/tests/nxb153_rust_toolchain_authority_platform_source_contract.rs <<'RS'
          use std::{fs, path::Path};

          const AUTHORITY_PATH: &str = "scripts/nxb-153-rust-toolchain-authority.py";

          fn source() -> String {
              let root = Path::new(env!("CARGO_MANIFEST_DIR")).join("../..");
              fs::read_to_string(root.join(AUTHORITY_PATH)).expect("authority source must be UTF-8")
          }

          #[test]
          fn self_test_uses_native_descriptor_model_and_portable_windows_collision_checks() {
              let text = source();
              let start = text.find("def self_test():").expect("self-test is missing");
              let end = text[start..]
                  .find("\n\ndef main():")
                  .map(|offset| start + offset)
                  .expect("self-test boundary is missing");
              let body = &text[start..end];

              for marker in [
                  "native_model = \"windows\" if os.name == \"nt\" else \"linux\"",
                  "first_native = digest_tree(first, native_model)",
                  "second_native = digest_tree(second, native_model)",
                  "digest_tree(bounded, native_model, max_files=1)",
                  "digest_tree(bounded, native_model, max_total_bytes=1)",
                  "digest_tree(directory_bound, native_model, max_directories=1)",
                  "digest_tree(symlink_root, native_model)",
                  "windows_relative_bytes(\"Tool.exe\")",
                  "windows_relative_bytes(\"tool.exe\")",
                  "if os.name != \"nt\":",
              ] {
                  assert!(body.contains(marker), "{AUTHORITY_PATH}: missing marker: {marker}");
              }

              for forbidden in [
                  "first_linux = digest_tree(first, \"linux\")",
                  "second_linux = digest_tree(second, \"linux\")",
                  "digest_tree(bounded, \"linux\", max_files=1)",
                  "digest_tree(bounded, \"linux\", max_total_bytes=1)",
                  "digest_tree(directory_bound, \"linux\", max_directories=1)",
                  "digest_tree(symlink_root, \"linux\")",
              ] {
                  assert!(
                      !body.contains(forbidden),
                      "{AUTHORITY_PATH}: Windows self-test would still invoke Linux descriptor authority: {forbidden}"
                  );
              }
          }
          RS

          cat > crates/nxb-core/tests/workspace_replacement_authority_source_contract.rs <<'RS'
          use std::{
              fs,
              path::{Path, PathBuf},
          };

          const NXB_PATH: &str = "crates/nxb-core/src/nxb.rs";
          const MIGRATION_PATH: &str = "crates/nxb-core/src/workspace/migration.rs";
          const REPLACEMENT_PATH: &str = "crates/nxb-core/src/workspace_authority_replacement.rs";
          const CARGO_PATH: &str = "crates/nxb-core/Cargo.toml";

          fn repository_root() -> PathBuf {
              Path::new(env!("CARGO_MANIFEST_DIR")).join("../..")
          }

          fn source(path: &str) -> String {
              let full = repository_root().join(path);
              fs::read_to_string(&full)
                  .unwrap_or_else(|error| panic!("could not read {} as UTF-8: {error}", full.display()))
          }

          fn section<'a>(text: &'a str, path: &str, start: &str, end: &str) -> &'a str {
              let start_index = text
                  .find(start)
                  .unwrap_or_else(|| panic!("{path}: missing section start: {start}"));
              let tail = &text[start_index..];
              let end_relative = tail
                  .find(end)
                  .unwrap_or_else(|| panic!("{path}: missing section end: {end}"));
              &tail[..end_relative]
          }

          #[test]
          fn linux_replacement_authority_is_compiled_without_a_new_syscall_dependency() {
              let nxb = source(NXB_PATH);
              assert!(nxb.contains("#[cfg(target_os = \"linux\")]\nmod workspace_authority_replacement;"));
              let cargo = source(CARGO_PATH);
              assert!(!cargo.contains("rustix"));
          }

          #[test]
          fn migration_routes_linux_manifest_replacement_through_the_authority_module_only() {
              let migration = source(MIGRATION_PATH);
              for marker in [
                  "#[cfg(target_os = \"linux\")]",
                  "use crate::workspace_authority_replacement::replace_document;",
                  "#[cfg(not(target_os = \"linux\"))]",
                  "use super::replace_document;",
                  "replace_document(&paths.manifest, &plan.target_bytes)?;",
              ] {
                  assert!(migration.contains(marker), "{MIGRATION_PATH}: missing marker: {marker}");
              }
          }

          #[test]
          fn linux_existing_destination_replacement_fails_closed_before_victim_mutation() {
              let replacement = source(REPLACEMENT_PATH);
              let production = section(
                  &replacement,
                  REPLACEMENT_PATH,
                  "struct ParentAuthority",
                  "\n#[cfg(test)]",
              );

              for marker in [
                  "O_DIRECTORY | O_NOFOLLOW",
                  "self.file.as_raw_fd()",
                  "parent.validate_named_binding()?;",
                  "parent.validate_child_binding(destination, previous, \"replacement destination\")?;",
                  "Linux replacement of an existing document is unsupported without exact-victim namespace mutation authority",
                  "const TRUSTED_LN: &str = \"/usr/bin/ln\";",
                  "prepared.file.as_raw_fd()",
              ] {
                  assert!(production.contains(marker), "{REPLACEMENT_PATH}: missing marker: {marker}");
              }

              for forbidden in [
                  "TRUSTED_MV",
                  "quarantine_no_replace",
                  ".arg(\"-n\")",
                  ".arg(\"-T\")",
                  "remove_file(",
                  "remove_regular(",
                  "fs::rename(",
                  "remove_dir_all(",
              ] {
                  assert!(!production.contains(forbidden), "{REPLACEMENT_PATH}: forbidden victim mutation marker: {forbidden}");
              }
          }

          #[test]
          fn linux_missing_destination_publication_remains_exact_fd_create_only() {
              let replacement = source(REPLACEMENT_PATH);
              let production = section(
                  &replacement,
                  REPLACEMENT_PATH,
                  "struct ParentAuthority",
                  "\n#[cfg(test)]",
              );
              for marker in [
                  ".arg(\"-L\")",
                  ".arg(\"--\")",
                  ".env_clear()",
                  "prepared.file.as_raw_fd()",
                  "parent.claim_prepared(&prepared, destination)?;",
                  "parent.validate_child_binding(destination, &prepared, \"replacement destination\")?;",
              ] {
                  assert!(production.contains(marker), "{REPLACEMENT_PATH}: missing create-only marker: {marker}");
              }
          }

          #[test]
          fn replacement_regressions_leave_existing_and_substituted_victims_untouched() {
              let replacement = source(REPLACEMENT_PATH);
              for marker in [
                  "existing_destination_fails_closed_without_victim_mutation",
                  "same_permission_destination_substitution_is_left_untouched",
                  "parent_directory_replacement_cannot_redirect_namespace_mutation",
                  "missing_destination_is_create_only_from_retained_prepared_fd",
                  "replacement destination pathname is not the retained file authority",
                  "replacement parent pathname no longer names the retained directory authority",
              ] {
                  assert!(replacement.contains(marker), "{REPLACEMENT_PATH}: missing regression marker: {marker}");
              }
          }
          RS

          python3 -I scripts/nxb-153-rust-toolchain-authority.py self-test
          grep -R -n --fixed-strings 'quarantine_no_replace' crates/nxb-core/src crates/nxb-core/tests && exit 1 || true
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          cargo +1.97.1 fmt --all
          cargo +1.97.1 test -p nxb-core --test nxb153_rust_toolchain_authority_platform_source_contract --test workspace_replacement_authority_source_contract
          git diff --check
      - name: Commit verified consolidated tree and retire helper workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/nxb-153-consolidated-fix-helper.yml
          git config user.name "nxb-153-helper"
          git config user.email "nxb-153-helper@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare consolidated NXB-153 admission fixes"
          git push origin HEAD:nxb-153-consolidated-fix-1959453
