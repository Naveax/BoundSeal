name: Operator stacked-PR maintenance

on:
  pull_request:
    branches:
      - nxb-130-local-adversarial-integration-lab
    paths:
      - "crates/nxb-operator/**"
      - "crates/nxb-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/operator-maintenance.yml"

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'nxb-131-135-product-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source branch
        uses: actions/checkout@v7
        with:
          ref: nxb-131-135-product-integration
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Correct exact form metadata contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/nxb-operator/src/lib.rs")
          text = path.read_text()
          old = 'if observation.source_kind.contains("form:form:action") {'
          new = 'if observation.source_kind == "form" {'
          if old not in text and new not in text:
              raise SystemExit("expected form source-kind contract not found")
          path.write_text(text.replace(old, new))
          PY
      - name: Canonicalize Rust and lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit normalized source branch
        run: |
          if git diff --quiet; then
            echo "Source branch is already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/nxb-core crates/nxb-operator
          git commit -m "chore: normalize operator integration"
          git push origin HEAD:nxb-131-135-product-integration
