name: NXB-145 patch inspection

on:
  push:
    branches:
      - nxb-145-signed-live-run-host

permissions:
  contents: write

concurrency:
  group: nxb145-patch-inspection
  cancel-in-progress: true

jobs:
  decode:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nxb-145-signed-live-run-host
      - name: Materialize inspected patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/nxb145_hardening.patch.gz.b64 | gzip -d > tools/nxb145_hardening.patch
          echo "eae8349b313e4179e94a56eb78598a7f8ad95fbf781c9fcc8042ee5e0b66eae2  tools/nxb145_hardening.patch" | sha256sum -c -
      - name: Commit inspection artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/nxb145_hardening.patch
          git commit -m "NXB-145: materialize lifecycle patch for inspection"
          git push origin HEAD:nxb-145-signed-live-run-host
