name: NXB-8 fix vault tests once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/nxb8-fix-vault-tests-once.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'nxb-8-secret-vault-and-session-boundary'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Replace equality assertions
        shell: python
        run: |
          import re
          from pathlib import Path
          path = Path('crates/nxb-vault/src/lib.rs')
          text = path.read_text()
          text, count_a = re.subn(
              r'''assert_eq!\(\s*vault\.lease\(&\[handle\], wrong, 30, 101\),\s*Err\(VaultError::AccessDenied\)\s*\);''',
              '''assert!(matches!(
                      vault.lease(&[handle], wrong, 30, 101),
                      Err(VaultError::AccessDenied)
                  ));''',
              text,
              count=1,
          )
          text, count_b = re.subn(
              r'''assert_eq!\(\s*headers\.take_for\("app\.example\.com", "https", 103\),\s*Err\(VaultError::HeaderLeaseConsumed\)\s*\);''',
              '''assert!(matches!(
                      headers.take_for("app.example.com", "https", 103),
                      Err(VaultError::HeaderLeaseConsumed)
                  ));''',
              text,
              count=1,
          )
          if count_a != 1 or count_b != 1:
              raise SystemExit(f'expected assertions not replaced: {count_a}, {count_b}')
          path.write_text(text)

      - name: Format and push
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nxb-vault/src/lib.rs
          git commit -m "NXB-8: avoid equality on secret capability results"
          git push origin HEAD:nxb-8-secret-vault-and-session-boundary
