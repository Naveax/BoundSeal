name: Temporary NXB-149 PR canonicalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/nxb-evidence-key-provider/**"
      - ".github/nxb149_fix.py"
      - ".github/workflows/nxb149-pr-canonicalizer.yml"

permissions:
  contents: write

concurrency:
  group: nxb149-pr-canonicalizer
  cancel-in-progress: true

jobs:
  canonicalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Apply and publish canonical sources
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/nxb149_fix.py
          cargo generate-lockfile
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/nxb-evidence-key-provider/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m "NXB-149: repair fixtures and canonicalize sources"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
