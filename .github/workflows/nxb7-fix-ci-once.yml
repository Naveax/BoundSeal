name: NXB-7 fix CI once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/nxb7-fix-ci-once.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'nxb-7-http1-framing-fixture'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove unused import and push
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/nxb-http1/src/codec.rs')
          text = path.read_text()
          old = '    BoundedByteStream, ByteStreamBackend, StreamControl, StreamOperationOutcome, StreamState,\n'
          new = '    BoundedByteStream, ByteStreamBackend, StreamControl, StreamOperationOutcome,\n'
          if old not in text:
              raise SystemExit('unused import pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nxb-http1/src/codec.rs
          git commit -m "NXB-7: remove unused codec import"
          git push origin HEAD:nxb-7-http1-framing-fixture
