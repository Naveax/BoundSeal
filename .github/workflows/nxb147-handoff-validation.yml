name: NXB-147 manual handoff validation

on:
  push:
    branches:
      - nxb-147-signed-manual-submission-handoff
  pull_request:
    branches:
      - main
    paths:
      - "crates/nxb-manual-submission-handoff/**"
      - "docs/NXB-147-SIGNED-MANUAL-SUBMISSION-HANDOFF.md"
      - ".github/workflows/nxb147-handoff-validation.yml"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: nxb147-handoff-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handoff-contract:
    name: handoff-contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Require canonical committed lockfile
        shell: bash
        run: |
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Check handoff contract
        run: cargo check -p nxb-manual-submission-handoff --all-features --locked
      - name: Clippy handoff contract
        run: cargo clippy -p nxb-manual-submission-handoff --all-targets --all-features --locked -- -D warnings
      - name: Test adversarial handoff contract
        run: cargo test -p nxb-manual-submission-handoff --all-features --locked -- --test-threads=1
