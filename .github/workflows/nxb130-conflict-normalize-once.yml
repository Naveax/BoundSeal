name: NXB-130 conflict normalization one-shot

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  normalize:
    if: >-
      github.event.pull_request.number == 36 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'nxb-129-end-to-end-orchestrator-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact internal head branch
        uses: actions/checkout@v7
        with:
          ref: nxb-129-end-to-end-orchestrator-cli
          fetch-depth: 0
      - name: Merge current main with verified branch precedence on conflict hunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit -X ours origin/main
          git push origin HEAD:nxb-129-end-to-end-orchestrator-cli
