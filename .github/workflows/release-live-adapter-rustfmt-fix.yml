name: Release live-adapter Rustfmt fix

on:
  push:
    branches:
      - release-v0.1.0-contract-complete
    paths:
      - ".github/.release-live-adapter-rustfmt-trigger"
      - ".github/workflows/release-live-adapter-rustfmt-fix.yml"

permissions:
  contents: write

concurrency:
  group: release-live-adapter-rustfmt-fix
  cancel-in-progress: false

jobs:
  format-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-v0.1.0-contract-complete
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Format verified TLS fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          changed="$(git diff --name-only)"
          test "$changed" = "crates/nxb-live-adapter/src/tests.rs"
          cargo fmt --all -- --check
          cargo check -p nxb-live-adapter --all-features --locked
          cargo clippy -p nxb-live-adapter --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-live-adapter --all-features --locked local_tls_http_exchange_uses_verified_certificate_and_http1 -- --exact --test-threads=1
      - name: Commit formatted fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/nxb-live-adapter/src/tests.rs
          git commit -m "test: format verified TLS fixture"
          git push origin HEAD:release-v0.1.0-contract-complete
