name: NXB-146 final materialization

on:
  push:
    branches:
      - nxb-146-signed-run-closure-clean

permissions:
  contents: write

concurrency:
  group: nxb146-final-materialization
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-slim
    timeout-minutes: 45
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v7
        with:
          ref: nxb-146-signed-run-closure-clean
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Materialize closure sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin nxb-146-signed-run-closure
          mkdir -p crates/nxb-run-closure/src crates/nxb-run-closure/tests docs
          git show origin/nxb-146-signed-run-closure:crates/nxb-run-closure/Cargo.toml > crates/nxb-run-closure/Cargo.toml
          git show origin/nxb-146-signed-run-closure:crates/nxb-run-closure/src/lib.rs > crates/nxb-run-closure/src/lib.rs
          git show origin/nxb-146-signed-run-closure:crates/nxb-run-closure/tests/closure.rs > crates/nxb-run-closure/tests/closure.rs
          git show origin/nxb-146-signed-run-closure:docs/NXB-146-SIGNED-RUN-CLOSURE.md > docs/NXB-146-SIGNED-RUN-CLOSURE.md
          git show origin/nxb-146-signed-run-closure:.github/nxb146_host_binding.py > /tmp/nxb146_host_binding.py
          python3 .github/nxb146_clean_finalize.py pre
          python3 /tmp/nxb146_host_binding.py
          python3 .github/nxb146_clean_finalize.py post
      - name: Validate product tree
        id: validate
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            cargo generate-lockfile
            cargo fmt --all
            cargo check -p nxb-run-closure -p nxb-live-run-host --all-features --locked
            cargo clippy -p nxb-run-closure -p nxb-live-run-host --all-targets --all-features --locked -- -D warnings
            cargo test -p nxb-run-closure -p nxb-live-run-host --all-features --locked -- --test-threads=1
          } 2>&1 | tee /tmp/nxb146-final-validation.log
          status=${PIPESTATUS[0]}
          {
            echo "source_head=${GITHUB_SHA}"
            echo "validation_exit=${status}"
            echo "--- validation tail ---"
            tail -n 200 /tmp/nxb146-final-validation.log
          } > .github/nxb146-final-validation.txt
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Persist result
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/nxb146-final-validation.txt
          if [[ "${{ steps.validate.outputs.status }}" == "0" ]]; then
            git add Cargo.toml Cargo.lock crates/nxb-run-closure docs/NXB-146-SIGNED-RUN-CLOSURE.md
            message="NXB-146: bind signed closure to terminal live host"
          else
            message="NXB-146: record final validation failure"
          fi
          git commit -m "$message"
          git push origin HEAD:nxb-146-signed-run-closure-clean
