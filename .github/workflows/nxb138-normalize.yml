name: NXB-138 one-time normalization

on:
  push:
    branches:
      - nxb-138-vault-backed-session-injection
    paths:
      - .github/workflows/nxb138-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nxb-138-vault-backed-session-injection
      - name: Normalize and verify
        run: |
          sed -i '/use url::Url;/d' crates/nxb-session-injection/src/lib.rs
          sed -i '/url.workspace = true/d' crates/nxb-session-injection/Cargo.toml
          cargo generate-lockfile
          cargo fmt --all
          cargo check --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-session-injection --locked
          cargo test -p nxb-live-adapter --locked
      - name: Commit canonical sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/nxb-session-injection crates/nxb-live-adapter/src crates/nxb-live-adapter/Cargo.toml Cargo.toml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "NXB-138: canonicalize injection sources and lockfile"
          git push origin HEAD:nxb-138-vault-backed-session-injection
