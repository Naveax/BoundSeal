name: NXB-138 one-time normalization

on:
  push:
    branches:
      - nxb-138-vault-backed-session-injection
    paths:
      - .github/workflows/nxb138-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nxb-138-vault-backed-session-injection
      - name: Normalize and verify
        run: |
          cargo fmt --all
          cargo check --workspace --all-features
          cargo test -p nxb-session-injection
          cargo test -p nxb-live-adapter
      - name: Commit generated lockfile and formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/nxb-session-injection crates/nxb-live-adapter/src crates/nxb-live-adapter/Cargo.toml Cargo.toml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "NXB-138: normalize vault session injection implementation"
          git push origin HEAD:nxb-138-vault-backed-session-injection
