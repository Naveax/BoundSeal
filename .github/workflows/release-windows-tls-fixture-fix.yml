name: Release Windows TLS fixture fix

on:
  push:
    branches:
      - release-v0.1.0-contract-complete
    paths:
      - ".github/.release-windows-tls-fix-trigger"
      - ".github/workflows/release-windows-tls-fixture-fix.yml"

permissions:
  contents: write

concurrency:
  group: release-windows-tls-fixture-fix
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-v0.1.0-contract-complete
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Bind HTTPS fixture to verified TLS grant
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("crates/nxb-live-adapter/src/tests.rs")
          text = path.read_text(encoding="utf-8")

          old_import = "use nxb_stream::{BoundedByteStream, StreamControl, StreamLimits};\n"
          new_import = old_import + "use nxb_tls::LibraryVerifiedTlsBinder;\n"
          if text.count(old_import) != 1:
              raise SystemExit(f"NXB release TLS import anchor mismatch: {text.count(old_import)}")
          text = text.replace(old_import, new_import, 1)

          old_observation = "    let observation = executor.backend().last_observation().unwrap();\n"
          new_observation = "    let observation = executor.backend().last_observation().unwrap().clone();\n"
          if text.count(old_observation) != 1:
              raise SystemExit(f"NXB release TLS observation anchor mismatch: {text.count(old_observation)}")
          text = text.replace(old_observation, new_observation, 1)

          old_codec = "    let mut codec = Http1Codec::new(stream, Http1Limits::conservative_default()).unwrap();\n"
          new_codec = '''    let verified_observation = observation
              .library_verified("nxb-live-local-tls:rustls-webpki")
              .unwrap();
          let tls_grant = LibraryVerifiedTlsBinder::new()
              .bind(&stream, &verified_observation)
              .unwrap();
          let mut codec = Http1Codec::new_verified_tls(
              stream,
              &tls_grant,
              Http1Limits::conservative_default(),
          )
          .unwrap();
          '''
          if text.count(old_codec) != 1:
              raise SystemExit(f"NXB release TLS codec anchor mismatch: {text.count(old_codec)}")
          path.write_text(text.replace(old_codec, new_codec, 1), encoding="utf-8")
          '@ | Set-Content -Encoding utf8 .github/release_windows_tls_fix.py
          python .github/release_windows_tls_fix.py
      - name: Format and validate fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check -p nxb-live-adapter --all-features --locked
          cargo clippy -p nxb-live-adapter --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-live-adapter --all-features --locked local_tls_http_exchange_uses_verified_certificate_and_http1 -- --exact --test-threads=1
      - name: Commit verified fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/nxb-live-adapter/src/tests.rs
          git commit -m "test: bind local HTTPS fixture to verified TLS grant"
          git push origin HEAD:release-v0.1.0-contract-complete
