name: NXB-146 clean materialization

on:
  push:
    branches:
      - nxb-146-signed-run-closure-clean
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/nxb146-clean-materialize.yml"
      - ".github/.nxb146-clean-trigger"

permissions:
  contents: write

concurrency:
  group: nxb146-clean-materialize-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-slim
    timeout-minutes: 45
    steps:
      - name: Checkout clean product branch
        uses: actions/checkout@v7
        with:
          ref: nxb-146-signed-run-closure-clean
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Copy closure sources from superseded branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin nxb-146-signed-run-closure
          mkdir -p crates/nxb-run-closure/src crates/nxb-run-closure/tests docs
          git show origin/nxb-146-signed-run-closure:crates/nxb-run-closure/Cargo.toml > crates/nxb-run-closure/Cargo.toml
          git show origin/nxb-146-signed-run-closure:crates/nxb-run-closure/src/lib.rs > crates/nxb-run-closure/src/lib.rs
          git show origin/nxb-146-signed-run-closure:crates/nxb-run-closure/tests/closure.rs > crates/nxb-run-closure/tests/closure.rs
          git show origin/nxb-146-signed-run-closure:docs/NXB-146-SIGNED-RUN-CLOSURE.md > docs/NXB-146-SIGNED-RUN-CLOSURE.md
          git show origin/nxb-146-signed-run-closure:.github/nxb146_host_binding.py > /tmp/nxb146_host_binding.py
      - name: Register workspace and normalize materializer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          member = '    "crates/nxb-run-closure",\n'
          if member not in text:
              anchor = '    "crates/nxb-resumable-runner",\n'
              if text.count(anchor) != 1:
                  raise SystemExit('NXB-146 workspace anchor mismatch')
              text = text.replace(anchor, anchor + member, 1)
              cargo.write_text(text, encoding='utf-8')

          path = Path('/tmp/nxb146_host_binding.py')
          text = path.read_text(encoding='utf-8')
          old = '''tests = replace_once(
              tests,
              \'''        &runner_checkpoint,
                  &runtime,
                  &export,
                  complete_input(&export, &runner_checkpoint, &runtime),
          \''',
              \'''        &runner_checkpoint,
                  &runtime,
                  &bundle,
                  &teardown,
                  &export,
                  complete_input(&export, &runner_checkpoint, &runtime, sha('d')),
          \''',
              "complete build call",
          )
          '''
          new = '''old_complete_build_call = \'''        &runner_checkpoint,
                  &runtime,
                  &export,
                  complete_input(&export, &runner_checkpoint, &runtime),
          \'''
          new_complete_build_call = \'''        &runner_checkpoint,
                  &runtime,
                  &bundle,
                  &teardown,
                  &export,
                  complete_input(&export, &runner_checkpoint, &runtime, sha('d')),
          \'''
          if old_complete_build_call not in tests:
              raise SystemExit("NXB-146 complete build call anchor missing")
          tests = tests.replace(old_complete_build_call, new_complete_build_call, 1)
          '''
          if text.count(old) != 1:
              raise SystemExit(f'NXB-146 materializer normalization mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply exact NXB-145 host binding
        run: python3 /tmp/nxb146_host_binding.py
      - name: Normalize generated closure source and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/nxb-run-closure/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          old = 'failure_sha256: hash_bytes(failure.as_bytes()),'
          new = 'failure_sha256: lower_hex(&Sha256::digest(failure.as_bytes())),'
          if text.count(old) != 1:
              raise SystemExit(f'NXB-146 failure hash anchor mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)
          for signature in [
              '    pub fn build(\n',
              '    pub fn verify_components(\n',
          ]:
              if text.count(signature) != 1:
                  raise SystemExit(f'NXB-146 bounded API anchor mismatch: {signature!r}')
              text = text.replace(
                  signature,
                  '    #[allow(clippy::too_many_arguments)]\n' + signature,
                  1,
              )
          path.write_text(text, encoding='utf-8')

          tests_path = Path('crates/nxb-run-closure/tests/closure.rs')
          tests = tests_path.read_text(encoding='utf-8')
          old_call = '''        &runtime,
        &export,
        input,
'''
          new_call = '''        &runtime,
        &launch_bundle(&plan, &runner_manifest),
        &completed_teardown(&runner_checkpoint, &runtime),
        &export,
        input,
'''
          if tests.count(old_call) != 1:
              raise SystemExit(f'NXB-146 remaining build call mismatch: {tests.count(old_call)}')
          tests_path.write_text(tests.replace(old_call, new_call, 1), encoding='utf-8')
          PY
      - name: Canonicalize and validate product tree
        id: validate
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            cargo generate-lockfile
            cargo fmt --all
            cargo check -p nxb-run-closure -p nxb-live-run-host --all-features --locked
            cargo clippy -p nxb-run-closure -p nxb-live-run-host --all-targets --all-features --locked -- -D warnings
            cargo test -p nxb-run-closure -p nxb-live-run-host --all-features --locked -- --test-threads=1
          } 2>&1 | tee /tmp/nxb146-validation.log
          status=${PIPESTATUS[0]}
          {
            echo "source_head=${GITHUB_SHA}"
            echo "validation_exit=${status}"
            echo "--- validation tail ---"
            tail -n 180 /tmp/nxb146-validation.log
          } > .github/nxb146-validation-result.txt
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Commit validation result
        if: ${{ always() && github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/nxb146-validation-result.txt
          if [[ "${{ steps.validate.outputs.status }}" == "0" ]]; then
            git add Cargo.toml Cargo.lock crates/nxb-run-closure docs/NXB-146-SIGNED-RUN-CLOSURE.md
            message="NXB-146: bind signed closure to terminal live host"
          else
            message="NXB-146: record clean validation failure"
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "$message"
          git push origin HEAD:nxb-146-signed-run-closure-clean
