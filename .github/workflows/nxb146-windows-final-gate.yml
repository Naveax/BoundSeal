name: NXB-146 Windows final gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: nxb146-windows-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'nxb-146-signed-run-closure-clean'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact NXB-146 branch
        uses: actions/checkout@v7
        with:
          ref: nxb-146-signed-run-closure-clean
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Canonicalize and validate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo generate-lockfile
          cargo fmt --all
          cargo check -p nxb-run-closure -p nxb-live-run-host --all-features --locked
          cargo clippy -p nxb-run-closure -p nxb-live-run-host --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-run-closure -p nxb-live-run-host --all-features --locked -- --test-threads=1
      - name: Commit canonical product state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock crates/nxb-run-closure docs/NXB-146-SIGNED-RUN-CLOSURE.md
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'NXB-146: canonicalize and validate terminal closure'
          git push origin HEAD:nxb-146-signed-run-closure-clean
