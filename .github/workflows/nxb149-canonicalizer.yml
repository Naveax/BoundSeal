name: Temporary NXB-149 canonicalizer

on:
  push:
    branches:
      - nxb-149-evidence-key-provider-lifecycle
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/nxb-evidence-key-provider/**"
      - ".github/workflows/nxb149-canonicalizer.yml"

permissions:
  contents: write

concurrency:
  group: nxb149-canonicalizer
  cancel-in-progress: true

jobs:
  canonicalize:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nxb-149-evidence-key-provider-lifecycle
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Apply repairs and materialize canonical sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/nxb-evidence-key-provider/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '''        if bytes.len() != EVIDENCE_SEALING_KEY_BYTES {
            return Err(EvidenceKeyProviderError::InvalidKeyMaterial);
        }''',
                  '''        if bytes.len() != EVIDENCE_SEALING_KEY_BYTES {
            bytes.zeroize();
            return Err(EvidenceKeyProviderError::InvalidKeyMaterial);
        }''',
              ),
              (
                  '''        activation.signature_hex.replace_range(0..2, "00");''',
                  '''        let replacement = if &activation.signature_hex[..2] == "00" {
            "01"
        } else {
            "00"
        };
        activation.signature_hex.replace_range(0..2, replacement);''',
              ),
              (
                  '''        assert_eq!(
            acquire_evidence_sealer(plan, activation, &mut provider, now),
            Err(EvidenceKeyProviderError::ProviderIdentityMismatch)
        );''',
                  '''        assert!(matches!(
            acquire_evidence_sealer(plan, activation, &mut provider, now),
            Err(EvidenceKeyProviderError::ProviderIdentityMismatch)
        ));''',
              ),
              (
                  '''        assert_eq!(
            acquire_evidence_sealer(plan, activation, &mut provider, now),
            Err(EvidenceKeyProviderError::ActivationSignatureInvalid)
        );''',
                  '''        assert!(matches!(
            acquire_evidence_sealer(plan, activation, &mut provider, now),
            Err(EvidenceKeyProviderError::ActivationSignatureInvalid)
        ));''',
              ),
              (
                  '''        assert_eq!(
            acquire_evidence_sealer(plan, activation, &mut provider, now),
            Err(EvidenceKeyProviderError::ProviderFetchFailure(
                "backend_failure".into()
            ))
        );''',
                  '''        assert!(matches!(
            acquire_evidence_sealer(plan, activation, &mut provider, now),
            Err(EvidenceKeyProviderError::ProviderFetchFailure(code))
                if code == "backend_failure"
        ));''',
              ),
              (
                  '''        assert_eq!(
            acquire_evidence_sealer(plan, activation, &mut provider, now),
            Err(EvidenceKeyProviderError::ProviderTeardownFailure(
                "teardown_failed".into()
            ))
        );''',
                  '''        assert!(matches!(
            acquire_evidence_sealer(plan, activation, &mut provider, now),
            Err(EvidenceKeyProviderError::ProviderTeardownFailure(code))
                if code == "teardown_failed"
        ));''',
              ),
              (
                  '''        assert_eq!(
            acquire_evidence_sealer(plan, activation, &mut provider, now),
            Err(EvidenceKeyProviderError::PlanDigestMismatch)
        );''',
                  '''        assert!(matches!(
            acquire_evidence_sealer(plan, activation, &mut provider, now),
            Err(EvidenceKeyProviderError::PlanDigestMismatch)
        ));''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one source block, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          cargo generate-lockfile
          cargo fmt --all
          git diff --check
          if git diff --quiet -- Cargo.lock crates/nxb-evidence-key-provider/src/lib.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/nxb-evidence-key-provider/src/lib.rs
          git commit -m "NXB-149: fix error fixtures and zeroize invalid key input"
          git push origin HEAD:nxb-149-evidence-key-provider-lifecycle
