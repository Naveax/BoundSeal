name: NXB-145 closure bootstrap

on:
  push:
    branches:
      - nxb-145-signed-run-closure

permissions:
  contents: write

concurrency:
  group: nxb145-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nxb-145-signed-run-closure
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Apply key-id binding fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/nxb-run-closure/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old = """        if public_key != plan.activation_public_key.as_slice() {
              return Err(RunClosureError::PublicKeyMismatch);
          }
          """
          new = """        if public_key.len() != 32
              || lower_hex(&Sha256::digest(public_key)) != plan.activation_key_id_sha256
          {
              return Err(RunClosureError::PublicKeyMismatch);
          }
          """
          if text.count(old) != 1:
              raise SystemExit("NXB-145 public-key anchor mismatch")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Canonicalize and validate
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo check -p nxb-run-closure --all-features --locked
          cargo clippy -p nxb-run-closure --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-run-closure --all-features --locked
      - name: Commit canonical output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock Cargo.toml crates/nxb-run-closure
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "NXB-145: canonicalize signed run closure"
          git push origin HEAD:nxb-145-signed-run-closure
