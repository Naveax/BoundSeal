name: NXB-6 fix open audit once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/nxb6-fix-open-audit-once.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'nxb-6-bounded-byte-stream-fixture'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch opening audit error mapping
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path("crates/nxb-stream/src/stream/engine.rs")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"        stream\.record\(\n"
              r"            None,\n"
              r"            StreamOperationOutcome::Opened,\n"
              r"            OperationMetrics::default\(\),\n"
              r"            StreamState::Open,\n"
              r"            StreamState::Open,\n"
              r"        \)\?;\n"
              r"        Ok\(stream\)"
          )
          replacement = '''        stream
              .record(
                  None,
                  StreamOperationOutcome::Opened,
                  OperationMetrics::default(),
                  StreamState::Open,
                  StreamState::Open,
              )
              .map_err(|error| {
                  StreamOpenError::BindingMismatch(format!("initial_stream_audit:{error}"))
              })?;
          Ok(stream)'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected exactly one opening audit block, found {count}")
          path.write_text(updated, encoding="utf-8")

      - name: Format workspace
        run: cargo fmt --all

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nxb-stream/src/stream/engine.rs
          git commit -m "Fix NXB-6 opening audit error mapping"
          git push origin HEAD:nxb-6-bounded-byte-stream-fixture
