name: Operator release hardening

on:
  pull_request:
    paths:
      - "crates/nxb-operator/**"
      - "crates/nxb-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/operator-release-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-platform-tests:
    name: Operator tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Verify lockfile
        run: cargo check --workspace --all-targets --locked
      - name: Operator tests
        run: cargo test -p nxb-operator --locked -- --test-threads=1
      - name: Core CLI tests
        run: cargo test -p nxb-core --locked -- --test-threads=1

  release-evidence:
    name: Release binary, SBOM and checksums
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Build release binary
        run: cargo build -p nxb-core --release --locked
      - name: Generate dependency metadata
        run: cargo metadata --locked --format-version 1 > target/cargo-metadata.json
      - name: Generate deterministic CycloneDX SBOM
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          metadata = json.loads(Path("target/cargo-metadata.json").read_text())
          components = []
          for package in sorted(
              metadata["packages"], key=lambda item: (item["name"], item["version"], item["id"])
          ):
              source = package.get("source") or "workspace"
              component = {
                  "type": "library",
                  "bom-ref": package["id"],
                  "name": package["name"],
                  "version": package["version"],
                  "purl": f"pkg:cargo/{package['name']}@{package['version']}",
                  "properties": [
                      {"name": "nxb:source", "value": source},
                      {"name": "nxb:manifest_path", "value": package["manifest_path"]},
                  ],
              }
              license_value = package.get("license")
              if license_value:
                  component["licenses"] = [{"expression": license_value}]
              components.append(component)

          serial_material = "\n".join(
              f"{item['name']}\0{item['version']}\0{item['bom-ref']}" for item in components
          ).encode()
          serial = hashlib.sha256(serial_material).hexdigest()
          sbom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.6",
              "serialNumber": f"urn:uuid:{serial[:8]}-{serial[8:12]}-{serial[12:16]}-{serial[16:20]}-{serial[20:32]}",
              "version": 1,
              "metadata": {
                  "component": {
                      "type": "application",
                      "name": "nxb",
                      "version": "0.1.0",
                  },
                  "properties": [
                      {"name": "nxb:network_activity", "value": "none"},
                      {"name": "nxb:source_sha", "value": "${{ github.sha }}"},
                  ],
              },
              "components": components,
          }
          output = Path("target/release-evidence")
          output.mkdir(parents=True, exist_ok=True)
          (output / "nxb.cdx.json").write_text(
              json.dumps(sbom, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Collect binary and SHA-256 checksums
        run: |
          set -euo pipefail
          cp target/release/nxb target/release-evidence/nxb-linux-x86_64
          cd target/release-evidence
          sha256sum nxb-linux-x86_64 nxb.cdx.json | LC_ALL=C sort > SHA256SUMS
          sha256sum SHA256SUMS > SHA256SUMS.sha256
      - name: Reject accidental secret material
        run: |
          ! grep -RIE 'authorization:|set-cookie:|bearer |password=|token=|private_key=' target/release-evidence
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@v4
        with:
          name: nxb-release-evidence-${{ github.run_id }}
          path: target/release-evidence
          retention-days: 14
