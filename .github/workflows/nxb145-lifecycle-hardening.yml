name: NXB-145 lifecycle hardening gate

on:
  push:
    branches:
      - nxb-145-signed-live-run-host
  pull_request:
    branches:
      - main
    paths:
      - "crates/nxb-live-run-host/**"
      - ".github/nxb145_lifecycle_harden.py"
      - ".github/workflows/nxb145-lifecycle-hardening.yml"
      - "tools/nxb145_hardening.patch*"

permissions:
  contents: write

concurrency:
  group: nxb145-lifecycle-hardening
  cancel-in-progress: true

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-slim
    timeout-minutes: 45
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v7
        with:
          ref: nxb-145-signed-live-run-host
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Apply deterministic lifecycle hardening
        run: python3 .github/nxb145_lifecycle_harden.py
      - name: Format and validate hardened host
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check -p nxb-live-run-host --all-features --locked
          cargo clippy -p nxb-live-run-host --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-live-run-host --all-features --locked -- --test-threads=1
      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/nxb-live-run-host/src/host.rs crates/nxb-live-run-host/src/error.rs crates/nxb-live-run-host/src/tests.rs
          git rm tools/nxb145_hardening.patch.gz.b64 tools/nxb145_hardening.patch
          git commit -m "NXB-145: harden initialization and fail-closed DNS paths"
          git push origin HEAD:nxb-145-signed-live-run-host
