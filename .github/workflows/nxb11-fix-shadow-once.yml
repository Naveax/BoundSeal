name: NXB-11 fix fixture shadow once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/nxb11-fix-shadow-once.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'nxb-11-tls-peer-identity-contract'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Rename verifier fixture helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/nxb-tls/tests/tls_identity.rs')
          text = path.read_text()
          text = text.replace('fn verifier() -> TlsPeerVerifier {', 'fn new_verifier() -> TlsPeerVerifier {', 1)
          text = text.replace('let mut verifier = verifier();', 'let mut verifier = new_verifier();')
          path.write_text(text)
          PY
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
          rm .github/workflows/nxb11-fix-shadow-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "NXB-11: avoid TLS fixture helper shadowing"
          git push origin HEAD:nxb-11-tls-peer-identity-contract
