name: Operator lockfile refresh

on:
  push:
    branches:
      - nxb-131-135-product-integration
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/nxb-core/Cargo.toml"
      - "crates/nxb-operator/Cargo.toml"
      - ".github/workflows/operator-lockfile-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nxb-131-135-product-integration
          fetch-depth: 0
      - run: rustup show active-toolchain
      - run: cargo generate-lockfile
      - name: Commit canonical lockfile when changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh operator Cargo.lock"
          git push origin HEAD:nxb-131-135-product-integration
