name: NXB-9 integrate v3 once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/nxb9-integrate-v3-once.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'nxb-9-cookie-jar-and-session-rotation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Integrate NXB-9
        shell: python
        run: |
          import re
          from pathlib import Path

          def one(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')
              return updated

          vault_path = Path('crates/nxb-vault/src/lib.rs')
          vault = vault_path.read_text()
          vault = one(
              vault,
              r'''        for handle in handles \{\n            let entry = self\.entries\.get\(handle\)\.ok_or\(VaultError::UnknownSecret\)\?;\n            validate_entry_access\(entry, &context, now_epoch_seconds\)\?;\n        \}''',
              '''        for handle in handles {
              let entry = self.entries.get(handle).ok_or(VaultError::UnknownSecret)?;
              match &entry.delivery {
                  SecretDelivery::Cookie(_) => {
                      validate_entry_identity(entry, &context, now_epoch_seconds)?;
                  }
                  SecretDelivery::Header { .. } => {
                      validate_entry_access(entry, &context, now_epoch_seconds)?;
                  }
              }
          }''',
              'vault lease loop',
          )
          vault = one(
              vault,
              r'''            let entry = self\.entries\.get\(handle\)\.ok_or\(VaultError::UnknownSecret\)\?;\n            validate_entry_access\(entry, &state\.context, now_epoch_seconds\)\?;\n            match &entry\.delivery \{\n                SecretDelivery::Cookie\(cookie\) => \{\n                    if cookie_applies\(cookie, &state\.context, request_target, now_epoch_seconds\)\? \{\n                        cookie_pairs\.push\(\(cookie\.name\.clone\(\), entry\.value\.duplicate\(\)\)\);\n                    \}\n                \}\n                SecretDelivery::Header \{ name, prefix \} => \{''',
              '''            let entry = self.entries.get(handle).ok_or(VaultError::UnknownSecret)?;
              match &entry.delivery {
                  SecretDelivery::Cookie(cookie) => {
                      validate_entry_identity(entry, &state.context, now_epoch_seconds)?;
                      let binding = &entry.metadata.binding;
                      if binding.allowed_hosts.contains(&state.context.authority)
                          && binding.allowed_schemes.contains(&state.context.scheme)
                          && cookie_applies(cookie, &state.context, request_target, now_epoch_seconds)?
                      {
                          cookie_pairs.push((cookie.name.clone(), entry.value.duplicate()));
                      }
                  }
                  SecretDelivery::Header { name, prefix } => {
                      validate_entry_access(entry, &state.context, now_epoch_seconds)?;''',
              'vault materialization loop',
          )
          vault = one(
              vault,
              r'''fn validate_entry_access\(\n    entry: &SecretEntry,\n    context: &VaultAccessContext,\n    now_epoch_seconds: i64,\n\) -> Result<\(\), VaultError> \{.*?\n\}\n\nfn cookie_applies''',
              '''fn validate_entry_identity(
              entry: &SecretEntry,
              context: &VaultAccessContext,
              now_epoch_seconds: i64,
          ) -> Result<(), VaultError> {
              if entry
                  .metadata
                  .expires_at_epoch_seconds
                  .is_some_and(|expires| now_epoch_seconds >= expires)
              {
                  return Err(VaultError::SecretExpired);
              }
              let binding = &entry.metadata.binding;
              if binding.run_id != context.run_id
                  || binding.worker_id != context.worker_id
                  || binding.account_id != context.account_id
                  || binding.tenant_id != context.tenant_id
                  || binding.role_id != context.role_id
              {
                  return Err(VaultError::AccessDenied);
              }
              Ok(())
          }

          fn validate_entry_access(
              entry: &SecretEntry,
              context: &VaultAccessContext,
              now_epoch_seconds: i64,
          ) -> Result<(), VaultError> {
              validate_entry_identity(entry, context, now_epoch_seconds)?;
              let binding = &entry.metadata.binding;
              if !binding.allowed_hosts.contains(&context.authority)
                  || !binding.allowed_schemes.contains(&context.scheme)
              {
                  return Err(VaultError::AccessDenied);
              }
              Ok(())
          }

          fn cookie_applies''',
              'vault access split',
              re.S,
          )
          vault_path.write_text(vault)

          cookie_path = Path('crates/nxb-cookie-jar/src/lib.rs')
          cookie = cookie_path.read_text()
          cookie = cookie.replace('CookieMutation::from(parsed)', 'CookieMutation::from_parsed(parsed)')
          cookie = cookie.replace('    fn from(parsed: ParsedSetCookie) -> Self {', '    fn from_parsed(parsed: ParsedSetCookie) -> Self {')
          cookie = cookie.replace('Some(&parsed.value_sha256)', 'Some(parsed.value_sha256.as_str())')
          cookie = cookie.replace('''            matches!(
                  byte,
                  0x21 | 0x23..=0x2B | 0x2D..=0x3A | 0x3C..=0x5B | 0x5D..=0x7E
              )''', '''            matches!(
                  *byte,
                  0x21 | 0x23..=0x2B | 0x2D..=0x3A | 0x3C..=0x5B | 0x5D..=0x7E
              )''')
          cookie_path.write_text(cookie)

          session_path = Path('crates/nxb-session/src/lib.rs')
          session = session_path.read_text()
          session = session.replace(
              'use nxb_http1::{Http1Codec, Http1Error, Http1Exchange, Http1Request};\n',
              'use nxb_cookie_jar::{\n    CookieCommit, CookieJar, CookieJarAuditChain, CookieJarConfig, CookieJarError, CookieOrigin,\n};\nuse nxb_http1::{Http1Codec, Http1Error, Http1Exchange, Http1Request};\n',
              1,
          )
          session = session.replace(
              '    InMemorySecretVault, SecretHandle, SecretHeaderLease, VaultAccessContext, VaultError,\n',
              '    InMemorySecretVault, SecretBinding, SecretHandle, SecretHeaderLease, SecretKind,\n    VaultAccessContext, VaultError,\n',
              1,
          )
          session = one(
              session,
              r'''pub struct SessionMetadata \{\n    pub session_id: String,\n    pub profile: SessionProfile,\n    pub status: SessionStatus,\n    pub created_at_epoch_seconds: i64,\n\}\n\n#\[derive\(Clone\)\]\nstruct SessionState \{\n    metadata: SessionMetadata,\n\}''',
              '''pub struct SessionMetadata {
              pub session_id: String,
              pub profile: SessionProfile,
              pub status: SessionStatus,
              pub created_at_epoch_seconds: i64,
              pub generation: u64,
              pub cookie_jar_audit_tail: String,
          }

          struct SessionState {
              metadata: SessionMetadata,
              cookie_jar: CookieJar,
          }''',
              'session metadata',
          )
          session = one(
              session,
              r'''        let metadata = SessionMetadata \{\n            session_id: session_id\.clone\(\),\n            profile,\n            status: SessionStatus::Active,\n            created_at_epoch_seconds: now_epoch_seconds,\n        \};\n        self\.sessions\.insert\(\n            session_id\.clone\(\),\n            SessionState \{\n                metadata: metadata\.clone\(\),\n            \},\n        \);''',
              '''        let non_cookie_handle_count = profile
              .secret_handles
              .iter()
              .map(|handle| vault.metadata(handle))
              .collect::<Result<Vec<_>, _>>()?
              .into_iter()
              .filter(|metadata| metadata.kind != SecretKind::Cookie)
              .count();
          let maximum_cookie_records = MAX_SECRET_HANDLES_PER_LEASE
              .checked_sub(non_cookie_handle_count)
              .ok_or_else(|| SessionError::InvalidProfile(
                  "non-cookie secret handles exceed the session limit".into(),
              ))?;
          let mut cookie_jar = CookieJar::new(
              format!("{session_id}-cookie-jar"),
              CookieJarConfig {
                  maximum_cookie_records,
                  ..CookieJarConfig::default()
              },
          )?;
          cookie_jar.seed_from_vault(&profile.secret_handles, vault)?;
          let metadata = SessionMetadata {
              session_id: session_id.clone(),
              profile,
              status: SessionStatus::Active,
              created_at_epoch_seconds: now_epoch_seconds,
              generation: cookie_jar.generation(),
              cookie_jar_audit_tail: cookie_jar.audit().tail_hash().to_string(),
          };
          self.sessions.insert(
              session_id.clone(),
              SessionState {
                  metadata: metadata.clone(),
                  cookie_jar,
              },
          );''',
              'session create',
          )
          session = session.replace(
              '''                (
                      "expires_at".into(),
                      metadata.profile.expires_at_epoch_seconds.to_string(),
                  ),''',
              '''                (
                      "expires_at".into(),
                      metadata.profile.expires_at_epoch_seconds.to_string(),
                  ),
                  ("generation".into(), metadata.generation.to_string()),''',
              1,
          )
          session = one(
              session,
              r'''        let state = self\n            \.sessions\n            \.get\(session_id\)\n            \.cloned\(\)\n            \.ok_or\(SessionError::UnknownSession\)\?;''',
              '''        let metadata = self
              .sessions
              .get(session_id)
              .map(|state| state.metadata.clone())
              .ok_or(SessionError::UnknownSession)?;''',
              'session exchange snapshot',
          )
          session = session.replace('        let result = (|| {', '        let mut result = (|| {', 1)
          session = session.replace('&state.metadata,', '&metadata,', 1)
          session = session.replace('&state.metadata.profile.secret_handles,', '&metadata.profile.secret_handles,', 1)
          session = one(
              session,
              r'''        \}\)\(\);\n\n        let \(outcome, result_code, response_status\) = match &result \{''',
              '''        })();

          let cookie_result = match result.as_ref() {
              Ok(exchange) => self.apply_response_cookies(
                  session_id,
                  vault,
                  exchange,
                  &authority,
                  &scheme,
                  &request.target,
                  options.now_epoch_seconds,
              ),
              Err(_) => Ok(None),
          };
          let cookie_commit = match cookie_result {
              Ok(commit) => commit,
              Err(error) => {
                  result = Err(error);
                  None
              }
          };
          let (cookie_inserted, cookie_replaced, cookie_deleted, generation) = cookie_commit
              .as_ref()
              .map(|commit| (
                  commit.inserted,
                  commit.replaced,
                  commit.deleted,
                  commit.generation_after,
              ))
              .unwrap_or((0, 0, 0, metadata.generation));

          let (outcome, result_code, response_status) = match &result {''',
              'session cookie result',
          )
          session = session.replace(
              '                ("response_status".into(), response_status),\n',
              '                ("response_status".into(), response_status),\n                ("cookie_inserted".into(), cookie_inserted.to_string()),\n                ("cookie_replaced".into(), cookie_replaced.to_string()),\n                ("cookie_deleted".into(), cookie_deleted.to_string()),\n                ("session_generation".into(), generation.to_string()),\n',
              1,
          )

          revoke_marker = '    pub fn revoke_session(&mut self, session_id: &str) -> Result<(), SessionError> {'
          if revoke_marker not in session:
              raise SystemExit('session revoke marker missing')
          helper = '''    fn apply_response_cookies(
              &mut self,
              session_id: &str,
              vault: &mut InMemorySecretVault,
              exchange: &Http1Exchange,
              authority: &str,
              scheme: &str,
              request_target: &str,
              now_epoch_seconds: i64,
          ) -> Result<Option<CookieCommit>, SessionError> {
              let set_cookie_values = exchange
                  .response
                  .headers
                  .iter()
                  .filter(|header| header.name.eq_ignore_ascii_case("set-cookie"))
                  .map(|header| header.value.clone())
                  .collect::<Vec<_>>();
              if set_cookie_values.is_empty() {
                  return Ok(None);
              }
              let state = self.sessions.get_mut(session_id).ok_or(SessionError::UnknownSession)?;
              let binding = secret_binding_from_profile(&state.metadata.profile);
              let origin = CookieOrigin::new(authority, scheme)?;
              let previous_cookie_handles = state
                  .cookie_jar
                  .active_handles()
                  .into_iter()
                  .collect::<BTreeSet<_>>();
              let commit = state.cookie_jar.apply_response(
                  vault,
                  &binding,
                  &origin,
                  request_target,
                  &set_cookie_values,
                  now_epoch_seconds,
              )?;
              state
                  .metadata
                  .profile
                  .secret_handles
                  .retain(|handle| !previous_cookie_handles.contains(handle));
              state
                  .metadata
                  .profile
                  .secret_handles
                  .extend(commit.active_handles.iter().cloned());
              state.metadata.profile.secret_handles = state
                  .metadata
                  .profile
                  .secret_handles
                  .iter()
                  .cloned()
                  .collect::<BTreeSet<_>>()
                  .into_iter()
                  .collect();
              state.metadata.generation = commit.generation_after;
              state.metadata.cookie_jar_audit_tail = commit.audit_tail.clone();
              Ok(Some(commit))
          }

          pub fn logout_session(
              &mut self,
              session_id: &str,
              vault: &mut InMemorySecretVault,
          ) -> Result<(), SessionError> {
              let state = self.sessions.get_mut(session_id).ok_or(SessionError::UnknownSession)?;
              let cookie_handles = state
                  .cookie_jar
                  .active_handles()
                  .into_iter()
                  .collect::<BTreeSet<_>>();
              let commit = state.cookie_jar.purge(vault, "logout")?;
              state
                  .metadata
                  .profile
                  .secret_handles
                  .retain(|handle| !cookie_handles.contains(handle));
              state.metadata.status = SessionStatus::Revoked;
              state.metadata.generation = commit.generation_after;
              state.metadata.cookie_jar_audit_tail = commit.audit_tail.clone();
              self.audit.append(SessionAuditEvent {
                  action: "session_logout".into(),
                  outcome: "revoked".into(),
                  broker_id: self.broker_id.clone(),
                  session_id: Some(session_id.into()),
                  metadata: BTreeMap::from([
                      ("cookie_deleted".into(), commit.deleted.to_string()),
                      ("generation".into(), commit.generation_after.to_string()),
                  ]),
              })?;
              Ok(())
          }

          pub fn cookie_jar_audit(
              &self,
              session_id: &str,
          ) -> Result<&CookieJarAuditChain, SessionError> {
              self.sessions
                  .get(session_id)
                  .map(|state| state.cookie_jar.audit())
                  .ok_or(SessionError::UnknownSession)
          }

          '''
          session = session.replace(revoke_marker, helper + revoke_marker, 1)
          session = session.replace(
              '    #[error("vault operation failed: {0}")]\n    Vault(#[from] VaultError),\n',
              '    #[error("vault operation failed: {0}")]\n    Vault(#[from] VaultError),\n    #[error("cookie jar operation failed: {0}")]\n    CookieJar(#[from] CookieJarError),\n',
              1,
          )
          session = session.replace(
              '            Self::Vault(_) => "vault_rejected",\n',
              '            Self::Vault(_) => "vault_rejected",\n            Self::CookieJar(_) => "cookie_jar_rejected",\n',
              1,
          )
          session = session.replace(
              'fn normalize_profile(\n',
              '''fn secret_binding_from_profile(profile: &SessionProfile) -> SecretBinding {
              SecretBinding {
                  run_id: profile.run_id.clone(),
                  worker_id: profile.worker_id.clone(),
                  account_id: profile.account_id.clone(),
                  tenant_id: profile.tenant_id.clone(),
                  role_id: profile.role_id.clone(),
                  allowed_hosts: profile.allowed_hosts.clone(),
                  allowed_schemes: profile.allowed_schemes.clone(),
              }
          }

          fn normalize_profile(
          ''',
              1,
          )
          session = session.replace(
              'bytes: b"HTTP/1.1 200 OK\\r\\nContent-Length: 2\\r\\n\\r\\nok".to_vec(),',
              'bytes: b"HTTP/1.1 200 OK\\r\\nSet-Cookie: session=rotated; Secure; HttpOnly; Path=/\\r\\nContent-Length: 2\\r\\n\\r\\nok".to_vec(),',
              1,
          )
          assertion = '        assert!(!session_audit.contains("session-secret-value"));\n'
          if assertion not in session:
              raise SystemExit('session assertion marker missing')
          session = session.replace(
              assertion,
              assertion + '''        let updated = broker.metadata(&session.session_id).unwrap();
              assert_eq!(updated.generation, 2);
              assert_eq!(updated.profile.secret_handles.len(), 2);
              broker
                  .cookie_jar_audit(&session.session_id)
                  .unwrap()
                  .verify()
                  .unwrap();
          ''',
              1,
          )
          session_path.write_text(session)

      - name: Format, clean bootstrap files and push
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
          rm -f .github/workflows/nxb9-bootstrap-once.yml
          rm -f .github/workflows/nxb9-integrate-v2-once.yml
          rm -f .github/workflows/nxb9-integrate-v3-once.yml
          rm -f crates/nxb-cookie-jar/.gitkeep
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Cargo.toml crates/nxb-cookie-jar crates/nxb-session crates/nxb-vault docs/NXB-9-COOKIE-JAR-AND-SESSION-ROTATION.md .github/workflows
          git commit -m "NXB-9: integrate cookie jar and session rotation"
          git push origin HEAD:nxb-9-cookie-jar-and-session-rotation
