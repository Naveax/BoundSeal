name: Temporary NXB-148 PR hardening materializer

on:
  pull_request:
    branches:
      - main
    paths:
      - "crates/nxb-evidence-sealer/**"
      - ".github/nxb148_harden.py"
      - ".github/workflows/nxb148-pr-hardening-materializer.yml"

permissions:
  contents: write

concurrency:
  group: nxb148-pr-hardening-materializer
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Apply and publish hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/nxb148_harden.py
          cargo generate-lockfile
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/nxb-evidence-sealer/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m "NXB-148: zeroize plaintext and tighten file identities"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
