name: NXB-142 operator state hardening

on:
  push:
    branches:
      - main
      - nxb-142-checkpointed-bounded-operator-state
  pull_request:

permissions:
  contents: read

concurrency:
  group: nxb142-state-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  state-contract:
    name: State contract, Clippy and recovery tests
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Canonical lockfile and formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p nxb-operator-state --all-features --locked
          cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p nxb-operator-state --all-targets --all-features --locked -- -D warnings
      - name: State and recovery tests
        run: cargo test -p nxb-operator-state --all-features --locked -- --test-threads=1

  state-windows:
    name: State and recovery tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
      - name: State and recovery tests
        shell: pwsh
        run: cargo test -p nxb-operator-state --all-features --locked -- --test-threads=1
