name: NXB-140 materialize process provider

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    name: Canonicalize and validate NXB-140
    runs-on: ubuntu-slim
    timeout-minutes: 50

    steps:
      - name: Checkout NXB-140 branch
        uses: actions/checkout@v7
        with:
          ref: nxb-140-process-vault-provider-backend
          fetch-depth: 0

      - name: Apply failed-pipe cleanup hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          library = Path("crates/nxb-vault-provider-process/src/lib.rs")
          text = library.read_text(encoding="utf-8")
          pattern = re.compile(
              r"        let stdin = child\n"
              r"            \.stdin\n"
              r"            \.take\(\)\n"
              r"            \.ok_or\(ProcessVaultProviderError::SpawnFailed\)\?;"
          )
          replacement = '''        let stdin = match child.stdin.take() {
              Some(stdin) => stdin,
              None => {
                  let _ = child.kill();
                  let _ = child.wait();
                  return Err(ProcessVaultProviderError::SpawnFailed);
              }
          };'''
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"unexpected stdin pipe setup count: {count}")
          library.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          fi
          source "$HOME/.cargo/env" 2>/dev/null || true
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Canonicalize and validate
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" 2>/dev/null || true
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-vault-provider-process --all-features --locked -- --test-threads=1
          git diff --check

      - name: Commit hardened canonical sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/nxb-vault-provider-process/src/lib.rs
          git commit -m "fix: reap process provider after pipe setup failure"
          git push origin HEAD:nxb-140-process-vault-provider-backend
