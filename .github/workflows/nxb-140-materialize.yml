name: NXB-140 materialize process provider

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    name: Canonicalize and validate NXB-140
    runs-on: ubuntu-slim
    timeout-minutes: 50

    steps:
      - name: Checkout NXB-140 branch
        uses: actions/checkout@v7
        with:
          ref: nxb-140-process-vault-provider-backend
          fetch-depth: 0

      - name: Correct timeout test phase
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          library = Path("crates/nxb-vault-provider-process/src/lib.rs")
          text = library.read_text(encoding="utf-8")
          old = "thread::sleep(Duration::from_secs(5));"
          new = "thread::sleep(Duration::from_secs(15));"
          if text.count(old) != 1:
              raise SystemExit(f"unexpected fixture stall count: {text.count(old)}")
          library.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          tests = Path("crates/nxb-vault-provider-process/tests/process_backend.rs")
          text = tests.read_text(encoding="utf-8")
          old = "provider_config(Duration::from_millis(250))"
          new = "provider_config(Duration::from_secs(5))"
          if text.count(old) != 1:
              raise SystemExit(f"unexpected timeout configuration count: {text.count(old)}")
          tests.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          fi
          source "$HOME/.cargo/env" 2>/dev/null || true
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Canonicalize and validate
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" 2>/dev/null || true
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-vault-provider-process --all-features --locked -- --test-threads=1
          git diff --check

      - name: Commit canonical sources and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock Cargo.toml \
            crates/nxb-vault-provider/src/provider.inc.rs \
            crates/nxb-vault-provider-process \
            .github/workflows/live-adapter-lab.yml
          git commit -m "NXB-140: canonicalize process vault-provider backend"
          git push origin HEAD:nxb-140-process-vault-provider-backend
