name: NXB-145 signed closure hardening

on:
  push:
    branches:
      - main
      - nxb-145-signed-run-closure
  pull_request:
    paths:
      - "crates/nxb-run-closure/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/NXB-145-SIGNED-RUN-CLOSURE.md"
      - ".github/nxb145_exact_binding.py"
      - ".github/workflows/nxb145-validation.yml"

permissions:
  contents: read

concurrency:
  group: nxb145-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure-contract:
    name: Closure contract, Clippy and adversarial tests
    runs-on: ubuntu-slim
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Apply exact component binding patch
        run: python3 .github/nxb145_exact_binding.py
      - name: Canonical lockfile and formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
      - name: Closure check
        run: cargo check -p nxb-run-closure --all-features --locked
      - name: Closure Clippy
        run: cargo clippy -p nxb-run-closure --all-targets --all-features --locked -- -D warnings
      - name: Closure tests
        run: cargo test -p nxb-run-closure --all-features --locked -- --test-threads=1

  closure-windows:
    name: Closure tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Apply exact component binding patch
        shell: pwsh
        run: python .github/nxb145_exact_binding.py
      - name: Closure tests
        shell: pwsh
        run: |
          cargo generate-lockfile
          cargo fmt --all
          cargo test -p nxb-run-closure --all-features --locked -- --test-threads=1
