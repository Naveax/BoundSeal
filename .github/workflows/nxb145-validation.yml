name: NXB-145 signed closure validation

on:
  pull_request:
    paths:
      - "crates/nxb-run-closure/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/NXB-145-SIGNED-RUN-CLOSURE.md"
      - ".github/workflows/nxb145-validation.yml"

permissions:
  contents: read

concurrency:
  group: nxb145-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closure-contract:
    runs-on: ubuntu-slim
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Apply key-id binding fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/nxb-run-closure/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old = "public_key != plan.activation_public_key.as_slice()"
          new = "public_key.len() != 32\n            || lower_hex(&Sha256::digest(public_key)) != plan.activation_key_id_sha256"
          if text.count(old) != 1:
              raise SystemExit("NXB-145 public-key expression mismatch")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Materialize canonical workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
      - name: Check
        run: cargo check -p nxb-run-closure --all-features --locked
      - name: Clippy
        run: cargo clippy -p nxb-run-closure --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test -p nxb-run-closure --all-features --locked
