name: NXB-146 live-host binding gate

on:
  push:
    branches:
      - nxb-146-signed-run-closure
  pull_request:
    branches:
      - main
    paths:
      - "crates/nxb-run-closure/**"
      - ".github/nxb146_host_binding.py"
      - ".github/workflows/nxb146-host-binding-gate.yml"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: write

concurrency:
  group: nxb146-host-binding-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-slim
    timeout-minutes: 45
    steps:
      - name: Checkout validation tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'nxb-146-signed-run-closure' }}
          fetch-depth: 0
      - name: Synchronize current main
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Normalize bounded materializer anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/nxb146_host_binding.py')
          text = path.read_text(encoding='utf-8')
          old = '''tests = replace_once(
              tests,
              \'''        &runner_checkpoint,
                  &runtime,
                  &export,
                  complete_input(&export, &runner_checkpoint, &runtime),
          \''',
              \'''        &runner_checkpoint,
                  &runtime,
                  &bundle,
                  &teardown,
                  &export,
                  complete_input(&export, &runner_checkpoint, &runtime, sha('d')),
          \''',
              "complete build call",
          )
          '''
          new = '''old_complete_build_call = \'''        &runner_checkpoint,
                  &runtime,
                  &export,
                  complete_input(&export, &runner_checkpoint, &runtime),
          \'''
          new_complete_build_call = \'''        &runner_checkpoint,
                  &runtime,
                  &bundle,
                  &teardown,
                  &export,
                  complete_input(&export, &runner_checkpoint, &runtime, sha('d')),
          \'''
          if old_complete_build_call not in tests:
              raise SystemExit("NXB-146 complete build call anchor missing")
          tests = tests.replace(old_complete_build_call, new_complete_build_call, 1)
          '''
          if text.count(old) != 1:
              raise SystemExit(f'NXB-146 materializer normalization mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply NXB-145 terminal-host binding
        run: python3 .github/nxb146_host_binding.py
      - name: Canonicalize and validate
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo check -p nxb-run-closure -p nxb-live-run-host --all-features --locked
          cargo clippy -p nxb-run-closure -p nxb-live-run-host --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-run-closure -p nxb-live-run-host --all-features --locked -- --test-threads=1
      - name: Commit validated product changes
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/nxb-run-closure
          if git diff --cached --quiet; then
            git push origin HEAD:nxb-146-signed-run-closure
            exit 0
          fi
          git commit -m "NXB-146: bind closure to NXB-145 terminal host"
          git push origin HEAD:nxb-146-signed-run-closure