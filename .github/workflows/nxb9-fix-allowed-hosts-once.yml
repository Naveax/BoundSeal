name: NXB-9 fix allowed hosts once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/nxb9-fix-allowed-hosts-once.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'nxb-9-cookie-jar-and-session-rotation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Add explicit cookie host-set type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/nxb-cookie-jar/src/lib.rs')
          text = path.read_text()
          old = '    let allowed_hosts = if cookie.host_only {\n'
          new = '    let allowed_hosts: BTreeSet<String> = if cookie.host_only {\n'
          if old not in text:
              raise SystemExit('allowed_hosts declaration not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nxb-cookie-jar/src/lib.rs
          git commit -m "NXB-9: type cookie allowed-host set"
          git push origin HEAD:nxb-9-cookie-jar-and-session-rotation
