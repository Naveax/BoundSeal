name: NXB-140 temporary canonicalizer

on:
  push:
    branches:
      - nxb-140-unified-live-operator

permissions:
  contents: write

concurrency:
  group: nxb140-canonicalizer
  cancel-in-progress: false

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: nxb-140-unified-live-operator
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Generate canonical files
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Validate new crate
        run: |
          cargo check -p nxb-unified-operator --all-features --locked
          cargo clippy -p nxb-unified-operator --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-unified-operator --all-features --locked
      - name: Commit canonical output
        run: |
          if git diff --quiet -- Cargo.lock crates/nxb-unified-operator/src/lib.rs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/nxb-unified-operator/src/lib.rs
          git commit -m 'NXB-140: canonicalize unified operator contract'
          git push origin HEAD:nxb-140-unified-live-operator
