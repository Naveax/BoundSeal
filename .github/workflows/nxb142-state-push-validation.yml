name: NXB-142 isolated push validation

on:
  push:
    branches:
      - nxb-142-validation-v3

permissions:
  contents: write

concurrency:
  group: nxb142-isolated-push-validation
  cancel-in-progress: true

jobs:
  validate-state-engine:
    runs-on: ubuntu-slim
    timeout-minutes: 35
    steps:
      - name: Checkout validation branch and preserve patch script
        uses: actions/checkout@v7
        with:
          ref: nxb-142-validation-v3
          fetch-depth: 0
      - name: Switch to exact NXB-142 source branch
        shell: bash
        run: |
          set -euo pipefail
          cp tools/nxb142_state_hardening.py /tmp/nxb142_state_hardening.py
          git fetch origin nxb-142-checkpointed-bounded-operator-state
          git checkout --force -B nxb-142-checkpointed-bounded-operator-state origin/nxb-142-checkpointed-bounded-operator-state
          python3 /tmp/nxb142_state_hardening.py
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Canonicalize and validate state engine
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo check -p nxb-operator-state --all-features --locked
          cargo clippy -p nxb-operator-state --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-operator-state --all-features --locked -- --test-threads=1
          git diff --check
      - name: Commit validated state engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/nxb-operator-state
          git commit -m "NXB-142: checkpointed bounded operator state"
          git push origin HEAD:nxb-142-checkpointed-bounded-operator-state
