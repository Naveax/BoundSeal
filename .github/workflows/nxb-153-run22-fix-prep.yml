name: NXB-153 Run 22 Fix Prep

on:
  push:
    branches:
      - nxb-153-run22-fix-prep

permissions:
  contents: write

concurrency:
  group: nxb-153-run22-fix-prep
  cancel-in-progress: false

jobs:
  verify-and-seal:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nxb-153-run22-fix-prep
          fetch-depth: 1

      - name: Apply exact run 22 source patches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/nxb-153-run22-prep.py

      - name: Parse Windows authority scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'scripts/nxb-153-windows-immutable-source-inner.ps1',
            'scripts/nxb-153-windows-dependency-source.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              throw "$path parse failure: $($errors | Out-String)"
            }
          }

      - name: Prove immutable-source ACL primitive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zeroSha = '0' * 40
          $zeroDigest = '0' * 64
          & .\scripts\nxb-153-windows-immutable-source-inner.ps1 `
            -RepoRoot . `
            -ValidationDirectory $env:RUNNER_TEMP `
            -HeadSha $zeroSha `
            -RustToolchain '1.97.1' `
            -CargoAuditVersion '0' `
            -CargoDenyVersion '0' `
            -AuditSha256 $zeroDigest `
            -DenySha256 $zeroDigest `
            -ExpectedCargoLockSha256 $zeroDigest `
            -AuditPath . `
            -DenyPath . `
            -SelfTest

      - name: Verify Rust regressions and formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.97.1 --profile minimal
          rustup run 1.97.1 cargo fmt --all
          rustup run 1.97.1 cargo fmt --all -- --check
          rustup run 1.97.1 cargo test -p nxb-core --test target_activation_cli --locked -- --test-threads=1
          rustup run 1.97.1 cargo test -p nxb-core --test nxb153_run20_windows_acl_source_contract --locked -- --test-threads=1
          rustup run 1.97.1 cargo test -p nxb-core --test nxb153_run22_windows_dependency_acl_source_contract --locked -- --test-threads=1

      - name: Seal verified prep branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath '.github/workflows/nxb-153-run22-fix-prep.yml' -Force
          Remove-Item -LiteralPath 'scripts/nxb-153-run22-prep.py' -Force
          git config user.name 'Naveax'
          git config user.email 'Omersevik095@gmail.com'
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Fix NXB-153 run 22 admission failures'
            git push origin HEAD:nxb-153-run22-fix-prep
          }
