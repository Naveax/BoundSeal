name: NXB-144 recovery invariant hardening

on:
  push:
    branches:
      - nxb-144-resumable-bounded-live-runner
    paths:
      - ".github/nxb144_recovery_hardening.py"
      - ".github/nxb144_recovery_order_fix.py"
      - ".github/workflows/nxb144-recovery-hardening.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/nxb144_recovery_hardening.py"
      - ".github/nxb144_recovery_order_fix.py"
      - ".github/workflows/nxb144-recovery-hardening.yml"

permissions:
  contents: write

concurrency:
  group: nxb144-recovery-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    name: Harden and validate recovery invariants
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 40
    steps:
      - name: Checkout exact product branch
        uses: actions/checkout@v7
        with:
          ref: nxb-144-resumable-bounded-live-runner
          fetch-depth: 0
      - name: Apply recovery hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/nxb144_recovery_hardening.py
          python3 .github/nxb144_recovery_order_fix.py
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Validate hardened runner
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p nxb-operator-runtime -p nxb-resumable-runner --all-features --locked
          cargo clippy -p nxb-operator-runtime -p nxb-resumable-runner --all-targets --all-features --locked -- -D warnings
          cargo test -p nxb-operator-runtime -p nxb-resumable-runner --all-features --locked -- --test-threads=1
          git diff --check
      - name: Commit validated recovery hardening
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/nxb144_recovery_hardening.py .github/nxb144_recovery_order_fix.py
          git add crates/nxb-resumable-runner/src/lib.rs
          git commit -m "NXB-144: harden checkpoint recovery invariants"
          git push origin HEAD:nxb-144-resumable-bounded-live-runner
