name: NXB-11 format once

on:
  pull_request:
    branches:
      - main
    paths:
      - "crates/nxb-tls/**"
      - "Cargo.toml"
      - ".github/workflows/nxb11-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'nxb-11-tls-peer-identity-contract'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Format TLS contract
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
          rm .github/workflows/nxb11-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "NXB-11: format TLS identity contract"
          git push origin HEAD:nxb-11-tls-peer-identity-contract
