name: NXB-4 format once

on:
  push:
    branches:
      - nxb-4-pinned-transport-contract

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: nxb-4-pinned-transport-contract
          fetch-depth: 0

      - name: Install stable Rust with rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Format workspace
        run: cargo +stable fmt --all

      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates
          git commit -m "chore: rustfmt NXB-4 transport contracts"
          git push origin HEAD:nxb-4-pinned-transport-contract
